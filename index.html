// abre os resultados numa aba nova (pra ver/imprimir na hora)
function exportarResultadosHTML() {
  const html = montarHTMLResultados();
  if (!html) return;
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

// baixa os resultados como arquivo .html no computador (pra levar/apresentar em outra máquina)
function baixarResultadosHTML() {
  const html = montarHTMLResultados();
  if (!html) return;
  const ini = (document.getElementById('rt-ini')||{}).value || '';
  const fim = (document.getElementById('rt-fim')||{}).value || '';
  const nome = `Resultados_Ecotrans_${ini}_a_${fim}.html`.replace(/[^\w.\-]/g,'_');
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}


function calcResultados() {
  const ini = (document.getElementById('rt-ini')||{}).value;
  const fim = (document.getElementById('rt-fim')||{}).value;
  const dIni = new Date(ini+'T00:00:00'), dFim = new Date(fim+'T23:59:59');
  const corpo = document.getElementById('rt-corpo');

  const leadsPeriodo = kanbanLeads.filter(l=>{ const d=parseDataReaj(l['DATA_CONTATO']); return d&&d>=dIni&&d<=dFim; });

  // ===== Cálculo por ENTRADA do lead (DATA_CONTATO) + ESTADO ATUAL =====
  // Funciona pra qualquer período, inclusive passado, sem depender da movimentação de cards.
  // "chegou em proposta" = está em Proposta Enviada OU Fechado (passou pela proposta).
  const ehProspFonte = l => String(l['FONTE']||'').toLowerCase().includes('prospec');
  const passivos = leadsPeriodo.filter(l=>l['ETAPA']!=='Cobertura' && !ehProspFonte(l));
  const totalLeads = passivos.length;
  const chegouProposta = l => l['ETAPA']==='Proposta Enviada' || l['ETAPA']==='Fechado';
  const propostas = passivos.filter(chegouProposta).length;
  const fechados = passivos.filter(l=>l['ETAPA']==='Fechado').length;

  // prospecção ativa do período (fonte Prospecção)
  const leadsProspecAtiva = leadsPeriodo.filter(l=>l['ETAPA']!=='Cobertura' && ehProspFonte(l));
  const prospParaProp = leadsProspecAtiva.filter(chegouProposta).length;
  const totalProspec = leadsProspecAtiva.length;

  const pct = (a,b)=> b>0 ? (a/b*100) : 0;
  const taxaLeadProposta  = pct(propostas, totalLeads);
  const taxaPropFechado   = pct(fechados, propostas);
  const taxaProspProposta = pct(prospParaProp, totalProspec);

  function cardTaxa(titulo, num, den, taxa, cor, exemplo) {
    const semBase = den===0;
    return `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;border-top:3px solid ${cor};">
      <div style="font-size:13px;color:var(--cinza-600);margin-bottom:8px;">${titulo}</div>
      <div style="font-size:34px;font-weight:700;font-family:var(--fonte-display);color:${semBase?'var(--cinza-400)':cor};">${semBase?'\u2014':taxa.toFixed(1)+'%'}</div>
      <div style="font-size:13px;color:var(--cinza-700);margin-top:4px;">${num} de ${den}</div>
      <div style="font-size:11px;color:var(--cinza-500);margin-top:8px;">${exemplo}</div>
    </div>`;
  }

  corpo.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;">
      ${cardTaxa('Leads \u2192 Proposta enviada', propostas, totalLeads, taxaLeadProposta, 'var(--verde-escuro)', `${propostas} propostas de ${totalLeads} leads novos no período`)}
      ${cardTaxa('Propostas \u2192 Fechamento', fechados, propostas, taxaPropFechado, 'var(--verde-ok)', `${fechados} fechados de ${propostas} propostas no período`)}
      ${cardTaxa('Prospecção \u2192 Proposta', prospParaProp, totalProspec, taxaProspProposta, '#BA7517', `${prospParaProp} de ${totalProspec} prospecções já chegaram em proposta`)}
    </div>
    ${blocoMetricasFunil(leadsPeriodo)}
    <div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;">
      <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 14px;">Resumo do período (${fmtDataBR(ini)} a ${fmtDataBR(fim)})</h3>
      <table style="width:100%;font-size:13px;border-collapse:collapse;">
        <tr style="border-bottom:1px solid var(--cinza-100);"><td style="padding:8px 0;color:var(--cinza-700);">Leads novos no período</td><td style="text-align:right;font-weight:600;">${totalLeads}</td></tr>
        <tr style="border-bottom:1px solid var(--cinza-100);"><td style="padding:8px 0;color:var(--cinza-700);">Movidos para "Proposta Enviada"</td><td style="text-align:right;font-weight:600;">${propostas}</td></tr>
        <tr style="border-bottom:1px solid var(--cinza-100);"><td style="padding:8px 0;color:var(--cinza-700);">Movidos para "Fechado"</td><td style="text-align:right;font-weight:600;color:var(--verde-ok);">${fechados}</td></tr>
        <tr><td style="padding:8px 0;color:var(--cinza-700);">Prospecções no período</td><td style="text-align:right;font-weight:600;">${totalProspec}</td></tr>
      </table>
    </div>
    ${blocoPorConsultor(leadsPeriodo, ini, fim)}
    ${blocoDeclinadosCoberturas(leadsPeriodo)}
    ${blocoFechamentosComissao()}`;
}

// blocos de Declinados (com motivos) e Coberturas (com empresas), do período
function blocoDeclinadosCoberturas(leadsPeriodo) {
  const declinados = leadsPeriodo.filter(l=>l['ETAPA']==='Declinado');
  const coberturas = leadsPeriodo.filter(l=>l['ETAPA']==='Cobertura');
  // agrupa declinados só pelo MOTIVO padronizado (ignora a observação livre).
  // dados antigos guardam "Motivo — observação" num campo só, então pega só a parte antes do "—".
  const soMotivo = l => String(l['MOTIVO_PERDA']||'Sem motivo informado').split('—')[0].split(' - ')[0].trim() || 'Sem motivo informado';
  const porMotivo = {};
  declinados.forEach(l=>{ const m=soMotivo(l); porMotivo[m]=(porMotivo[m]||0)+1; });
  const motivosOrd = Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]);

  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px;">';
  // Declinados
  html += `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;border-top:3px solid var(--vermelho);">
    <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 4px;color:var(--vermelho);">Declinados no período</h3>
    <div style="font-size:28px;font-weight:700;font-family:var(--fonte-display);color:var(--vermelho);margin-bottom:12px;">${declinados.length}</div>`;
  if (motivosOrd.length) {
    html += '<div style="font-size:12px;color:var(--cinza-600);margin-bottom:8px;">Por motivo:</div>';
    motivosOrd.forEach(([m,n])=>{
      const pct = Math.round(n/declinados.length*100);
      html += `<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${m}</span><b>${n} (${pct}%)</b></div>
        <div style="height:6px;background:var(--cinza-100);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--vermelho);"></div></div>
      </div>`;
    });
  } else { html += '<div style="font-size:13px;color:var(--cinza-500);">Nenhum declinado no período.</div>'; }
  html += '</div>';
  // Coberturas
  html += `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;border-top:3px solid var(--roxo);">
    <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 4px;color:var(--roxo);">Coberturas no período</h3>
    <div style="font-size:28px;font-weight:700;font-family:var(--fonte-display);color:var(--roxo);margin-bottom:12px;">${coberturas.length}</div>
    <div style="font-size:11px;color:var(--cinza-500);margin-bottom:8px;">Não entram nas conversões (cliente já atendido por outra empresa).</div>`;
  if (coberturas.length) {
    // consolida por transportadora (empresa que atende), com %
    const porTransp = {};
    coberturas.forEach(l=>{ const t=l['EMPRESA_COLETA_ATUAL']||'Não informado'; porTransp[t]=(porTransp[t]||0)+1; });
    const transpOrd = Object.entries(porTransp).sort((a,b)=>b[1]-a[1]);
    html += '<div style="font-size:12px;color:var(--cinza-600);margin-bottom:8px;">Por transportadora atual:</div>';
    transpOrd.forEach(([t,n])=>{
      const pct = Math.round(n/coberturas.length*100);
      html += `<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${t}</span><b>${n} (${pct}%)</b></div>
        <div style="height:6px;background:var(--cinza-100);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--roxo);"></div></div>
      </div>`;
    });
  } else { html += '<div style="font-size:13px;color:var(--cinza-500);">Nenhuma cobertura no período.</div>'; }
  // coberturas com proposta enviada registrada (acessível, mas fora dos números)
  const comProp = coberturas.filter(l=>String(l['PROPOSTA_COBERTURA']||'').toLowerCase()==='sim');
  if (comProp.length) {
    html += `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--cinza-200);">
      <div style="font-size:12px;color:#6B5B95;font-weight:600;margin-bottom:6px;"><i class="ti ti-file-check"></i> ${comProp.length} com proposta enviada (clique pra abrir):</div>
      ${comProp.map(l=>`<div onclick="abrirLead('${String(l['ID_LEAD']||'').replace(/'/g,"\\'")}')" style="cursor:pointer;font-size:12px;padding:3px 0;color:var(--cinza-700);"><i class="ti ti-external-link" style="font-size:12px;"></i> ${l['CLIENTE']||'—'}${l['VALOR_PROPOSTA_COBERTURA']?' · '+fmtMoeda(l['VALOR_PROPOSTA_COBERTURA']):''}${l['DATA_PROPOSTA_COBERTURA']?' · '+fmtDataBR(l['DATA_PROPOSTA_COBERTURA']):''}</div>`).join('')}
    </div>`;
  }
  html += '</div></div>';
  return html;
}

// desempenho por consultor: tabela resumo + detalhe expansível de cada um.
// "Leads" conta só fontes PASSIVAS (exclui prospecção e cobertura). Prospecção tem bloco próprio.
function blocoPorConsultor(leadsPeriodo, ini, fim) {
  const val = l => { const v=l['VALOR_R$']; if(v==null||v==='')return 0; if(typeof v==='number')return v; let s=String(v).replace(/[^\d,.-]/g,''); if(s.includes(',')&&s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
  const ehProspec = l => String(l['FONTE']||'').toLowerCase().includes('prospec');
  const ehDeCliente = l => String(l['FONTE']||'').toLowerCase().includes('cliente');
  // leads passivos = tudo menos cobertura e menos prospecção
  const passivos = leadsPeriodo.filter(l=>l['ETAPA']!=='Cobertura' && !ehProspec(l));
  const porCons = {};
  passivos.forEach(l=>{
    const c = l['CONSULTOR']||'Sem consultor';
    porCons[c] = porCons[c] || {leads:0, cliente:0, proposta:0, fechado:0, declinado:0, contato:0, prospec:0, valor:0, itens:[]};
    const o = porCons[c]; o.leads++;
    if (ehDeCliente(l)) o.cliente++; // lead cuja fonte é "cliente" (indicação de cliente)
    const e = l['ETAPA'];
    if (e==='Proposta Enviada') o.proposta++;
    else if (e==='Fechado') { o.fechado++; o.valor+=val(l); }
    else if (e==='Declinado') o.declinado++;
    else if (e==='Em Contato') o.contato++;
    else o.prospec++;
    o.itens.push(l);
  });
  const linhas = Object.entries(porCons).sort((a,b)=>b[1].fechado-a[1].fechado || b[1].leads-a[1].leads);
  if (!linhas.length) return '';
  // guarda os dados pra impressão (tabela grande e bonita)
  window._desempCons = { ini, fim, linhas: linhas.map(([c,o])=>({consultor:c, leads:o.leads, cliente:o.cliente, proposta:o.proposta, fechado:o.fechado, declinado:o.declinado, valor:o.valor})) };
  let html = `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 4px;">Desempenho por consultor (leads recebidos)</h3>
      <button onclick="imprimirDesempenhoConsultor()" style="padding:7px 13px;border:1.5px solid var(--verde-medio);background:#fff;color:var(--verde-escuro);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;"><i class="ti ti-printer"></i> Imprimir tabela</button>
    </div>
    <div style="font-size:12px;color:var(--cinza-500);margin-bottom:12px;"><i class="ti ti-info-circle"></i> Só leads que chegaram (Google, indicação, cliente, licitação, SP Regula). "De cliente" = leads indicados por clientes. Prospecção ativa está no bloco abaixo. Clique num consultor para ver os leads.</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;">
      <thead><tr style="border-bottom:2px solid var(--cinza-200);">
        <th style="text-align:left;padding:8px 0;">Consultor</th><th style="text-align:right;">Leads</th>
        <th style="text-align:right;">De cliente</th>
        <th style="text-align:right;">Proposta</th><th style="text-align:right;">Fechado</th>
        <th style="text-align:right;">Declinado</th><th style="text-align:right;">Valor fechado</th>
      </tr></thead><tbody>`;
  linhas.forEach(([c,o],idx)=>{
    const detId = 'cons-det-'+idx;
    const ordEtapa = e => ({'Fechado':0,'Proposta Enviada':1,'Em Contato':2,'Declinado':4}[e]??3);
    const detalhe = o.itens.sort((a,b)=>{
        // primeiro agrupa por FONTE (Google juntos, Indicação juntos...), depois por etapa dentro da fonte
        const fa=String(a['FONTE']||'').toLowerCase(), fb=String(b['FONTE']||'').toLowerCase();
        if(fa!==fb) return fa<fb?-1:1;
        return ordEtapa(a['ETAPA'])-ordEtapa(b['ETAPA']);
      })
      .map(l=>`<tr style="background:var(--cinza-50);border-bottom:1px solid var(--cinza-100);font-size:12px;"><td style="padding:5px 0 5px 20px;">${l['CLIENTE']||'—'}</td><td colspan="3" style="color:var(--cinza-600);">${rotEtapa(l['ETAPA'])}${l['ETAPA']==='Declinado'&&l['MOTIVO_PERDA']?' · '+l['MOTIVO_PERDA']:''}</td><td colspan="1" style="color:var(--cinza-600);font-size:11px;">${l['FONTE']||''}</td><td colspan="2" style="text-align:right;color:var(--cinza-600);">${val(l)?fmtMoeda(val(l)):'—'}</td></tr>`).join('');
    html += `<tr style="border-bottom:1px solid var(--cinza-100);cursor:pointer;" onclick="var e=document.getElementById('${detId}');e.style.display=e.style.display==='table-row-group'?'none':'table-row-group';">
        <td style="padding:8px 0;"><i class="ti ti-chevron-right" style="font-size:12px;"></i> ${c}</td>
        <td style="text-align:right;">${o.leads}</td>
        <td style="text-align:right;color:var(--verde-escuro);font-weight:600;">${o.cliente}</td>
        <td style="text-align:right;">${o.proposta}</td>
        <td style="text-align:right;font-weight:600;color:var(--verde-medio);">${o.fechado}</td>
        <td style="text-align:right;color:var(--vermelho);">${o.declinado}</td>
        <td style="text-align:right;font-weight:600;">${o.valor?fmtMoeda(o.valor):'—'}</td></tr>
      <tbody id="${detId}" style="display:none;">${detalhe}</tbody>`;
  });
  html += '</tbody></table></div>';
  html += blocoProspeccaoPorConsultor(leadsPeriodo);
  return html;
}

// prospecção ATIVA por consultor: quanto prospectou, quantas viraram Proposta Enviada (com %) e quantas fecharam
function blocoProspeccaoPorConsultor(leadsPeriodo) {
  const ehProspec = l => String(l['FONTE']||'').toLowerCase().includes('prospec');
  const prospec = leadsPeriodo.filter(l=>l['ETAPA']!=='Cobertura' && ehProspec(l));
  const porCons = {};
  prospec.forEach(l=>{
    const c = l['CONSULTOR']||'Sem consultor';
    porCons[c] = porCons[c] || {total:0, proposta:0, fechado:0, itens:[]};
    const o = porCons[c]; o.total++;
    if (l['ETAPA']==='Proposta Enviada' || l['ETAPA']==='Fechado') o.proposta++; // chegou (ou passou) por proposta
    if (l['ETAPA']==='Fechado') o.fechado++;
    o.itens.push(l);
  });
  const linhas = Object.entries(porCons).sort((a,b)=>b[1].total-a[1].total);
  let corpo;
  if (!linhas.length) {
    corpo = '<div style="font-size:13px;color:var(--cinza-500);padding:8px 0;">Nenhuma prospecção ativa no período.</div>';
  } else {
    corpo = `<table style="width:100%;font-size:13px;border-collapse:collapse;">
      <thead><tr style="border-bottom:2px solid var(--cinza-200);">
        <th style="text-align:left;padding:8px 0;">Consultor</th><th style="text-align:right;">Prospectou</th>
        <th style="text-align:right;">Virou proposta</th><th style="text-align:right;">% p/ proposta</th><th style="text-align:right;">Fechou</th>
      </tr></thead><tbody>` +
      linhas.map(([c,o],idx)=>{
        const detId = 'prosp-det-'+idx;
        const pct = o.total ? Math.round(o.proposta/o.total*100) : 0;
        const detalhe = o.itens.map(l=>`<tr style="background:var(--cinza-50);border-bottom:1px solid var(--cinza-100);font-size:12px;"><td style="padding:5px 0 5px 20px;">${l['CLIENTE']||'—'}</td><td colspan="4" style="color:var(--cinza-600);">${rotEtapa(l['ETAPA'])}</td></tr>`).join('');
        return `<tr style="border-bottom:1px solid var(--cinza-100);cursor:pointer;" onclick="var e=document.getElementById('${detId}');e.style.display=e.style.display==='table-row-group'?'none':'table-row-group';">
            <td style="padding:8px 0;"><i class="ti ti-chevron-right" style="font-size:12px;"></i> ${c}</td>
            <td style="text-align:right;font-weight:600;">${o.total}</td>
            <td style="text-align:right;">${o.proposta}</td>
            <td style="text-align:right;font-weight:600;color:${pct>=50?'var(--verde-medio)':'var(--cinza-700)'};">${pct}%</td>
            <td style="text-align:right;color:var(--verde-medio);">${o.fechado}</td></tr>
          <tbody id="${detId}" style="display:none;">${detalhe}</tbody>`;
      }).join('') + '</tbody></table>';
  }
  return `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;border-top:3px solid var(--verde-claro);">
    <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 4px;color:var(--verde-escuro);">Prospecção ativa por consultor</h3>
    <div style="font-size:12px;color:var(--cinza-500);margin-bottom:12px;"><i class="ti ti-target-arrow"></i> Leads de fonte "Prospecção" (o consultor foi atrás). "Virou proposta" = chegou em Proposta Enviada ou além.</div>
    ${corpo}
  </div>`;
}

// métricas financeiras do funil (ticket médio, valor em jogo, conversão em fechamentos)
// calculadas dos leads do período. Coberturas ficam de fora (regra do negócio).
function blocoMetricasFunil(leadsPeriodo) {
  const val = l => { const v=l['VALOR_R$']; if(v==null||v==='')return 0; if(typeof v==='number')return v; let s=String(v).replace(/[^\d,.-]/g,''); if(s.includes(',')&&s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
  const semCobertura = (leadsPeriodo||[]).filter(l=>l['ETAPA']!=='Cobertura');
  // propostas enviadas = leads que passaram por Proposta Enviada (ou estão além dela)
  const etapasEnviada = ['Proposta Enviada','Fechado','Declinado'];
  const propostasEnv = semCobertura.filter(l=>etapasEnviada.includes(l['ETAPA']));
  const valPropostas = propostasEnv.reduce((s,l)=>s+val(l),0);
  const ticket = propostasEnv.length ? valPropostas/propostasEnv.length : 0;
  // valor em jogo = propostas enviadas ainda em aberto (não fechadas nem declinadas)
  const emAberto = semCobertura.filter(l=>l['ETAPA']==='Proposta Enviada');
  const valorEmJogo = emAberto.reduce((s,l)=>s+val(l),0);
  // conversão em fechamentos = fechados / propostas enviadas
  const fechadosN = propostasEnv.filter(l=>l['ETAPA']==='Fechado').length;
  const convFech = propostasEnv.length ? (fechadosN/propostasEnv.length*100) : 0;
  const card = (lbl, valor, cor) => `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:16px;border-top:3px solid ${cor};">
    <div style="font-size:22px;font-weight:700;font-family:var(--fonte-display);color:${cor};">${valor}</div>
    <div style="font-size:12px;color:var(--cinza-600);margin-top:2px;">${lbl}</div></div>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px;">
    ${card('Propostas enviadas', propostasEnv.length, 'var(--verde-escuro)')}
    ${card('Ticket médio', fmtMoeda(ticket), 'var(--verde-medio)')}
    ${card('Valor em jogo (em aberto)', fmtMoeda(valorEmJogo), '#BA7517')}
    ${card('Conversão em fechamentos', convFech.toFixed(1)+'%', 'var(--verde-ok)')}
  </div>`;
}

// bloco de fechamentos vindos da planilha de comissões (processada no módulo Financeiro).
// Mostra fechamentos por consultor + aditivos/recicláveis à parte. Se não há dados, orienta subir.
function blocoFechamentosComissao() {
  let fech = [];
  try { if (typeof finCarregar==='function') { finCarregar(); fech = (typeof FINdados!=='undefined' && FINdados.fechamentos) ? FINdados.fechamentos : []; } } catch(e) {}
  if (!fech.length) {
    return `<div style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;">
      <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0 0 8px;">Fechamentos (planilha de comissões)</h3>
      <div style="background:var(--amarelo-bg);border-radius:8px;padding:12px;font-size:13px;color:#8a6d00;">Para ver os fechamentos aqui, suba a planilha de comissões no módulo <b>Financeiro › Relatórios</b>.</div>
    </div>`;
  }
  const meses = [...new Set(fech.map(f=>f.mesRef).filter(m=>m&&!String(m).endsWith('-00')))].sort();
  const rotMes = (m)=> (typeof finRotMes==='function' && m) ? finRotMes(m) : m;

  // monta o conteúdo (tabela) de um conjunto de fechamentos
  let idxGlobal = 0;
  const montaConteudo = (arr, chaveMes) => {
    const contam = arr.filter(f=>!f.foraDoTotal);
    const fora = arr.filter(f=>f.foraDoTotal);
    const totVal = contam.reduce((s,x)=>s+(x.valor||0),0);
    const porCons = {};
    contam.forEach(f=>{ porCons[f.consultor]=porCons[f.consultor]||{n:0,v:0,itens:[]}; porCons[f.consultor].n++; porCons[f.consultor].v+=(f.valor||0); porCons[f.consultor].itens.push(f); });
    const linhasCons = Object.entries(porCons).sort((a,b)=>b[1].v-a[1].v).map(([c,o])=>{
      const detId = 'fech-det-'+chaveMes+'-'+(idxGlobal++);
      const detalhe = o.itens.sort((a,b)=>(b.valor||0)-(a.valor||0)).map(f=>
        `<tr style="border-bottom:1px solid var(--cinza-100);background:var(--cinza-50);"><td style="padding:6px 0 6px 20px;">${f.cliente}</td><td><span class="badge" style="background:var(--verde-claro-bg);color:var(--verde-escuro);font-size:10px;padding:2px 6px;border-radius:4px;">${f.tipo}</span></td><td style="text-align:right;">${f.data||'—'}</td><td style="text-align:right;">${fmtMoeda(f.valor)}</td></tr>`
      ).join('');
      return `<tr style="border-bottom:1px solid var(--cinza-100);cursor:pointer;" onclick="var e=document.getElementById('${detId}');e.style.display=e.style.display==='table-row-group'?'none':'table-row-group';">
          <td style="padding:8px 0;"><i class="ti ti-chevron-right" style="font-size:12px;"></i> ${c}</td><td style="text-align:right;">${o.n}</td><td style="text-align:right;font-weight:600;">${fmtMoeda(o.v)}</td></tr>
        <tbody id="${detId}" style="display:none;"><tr style="font-size:11px;color:var(--cinza-500);"><td style="padding:4px 0 4px 20px;">Cliente</td><td>Tipo</td><td style="text-align:right;">Data</td><td style="text-align:right;">Valor</td></tr>${detalhe}</tbody>`;
    }).join('');
    const foraTxt = fora.length ? `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--cinza-300);">
        <div style="font-size:13px;color:var(--roxo);font-weight:600;margin-bottom:6px;">Aditivos e Eventuais Recicláveis (${fora.length}) — não somam ao total</div>
        <div style="font-size:12px;color:var(--cinza-600);">Total à parte: ${fmtMoeda(fora.reduce((s,x)=>s+(x.valor||0),0))}</div>
      </div>` : '';
    return `<div style="font-size:12px;color:var(--cinza-500);margin-bottom:12px;">${contam.length} fechamentos · ${fmtMoeda(totVal)} · <i class="ti ti-info-circle"></i> clique num consultor para ver o detalhe</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;">
        <thead><tr style="border-bottom:2px solid var(--cinza-200);"><th style="text-align:left;padding:8px 0;">Consultor</th><th style="text-align:right;">Fechamentos</th><th style="text-align:right;">Valor</th></tr></thead>
        ${linhasCons}
      </table>${foraTxt}`;
  };

  // um container por mês (todos no HTML) + o de "todos". O filtro só mostra/esconde — funciona sem re-render.
  const blocoTodos = `<div class="fech-mes-bloco" data-fmes="todos">${montaConteudo(fech,'todos')}</div>`;
  const blocosMes = meses.map(m=>`<div class="fech-mes-bloco" data-fmes="${m}" style="display:none;">${montaConteudo(fech.filter(f=>f.mesRef===m), m)}</div>`).join('');

  // o select controla a visibilidade via JS puro (sem depender de renderResultadosCRM)
  const selMes = `<select onchange="(function(v,sel){var w=sel.closest('.fech-wrap');w.querySelectorAll('.fech-mes-bloco').forEach(function(b){b.style.display=b.getAttribute('data-fmes')===v?'block':'none';});})(this.value,this)" style="padding:6px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:12px;">
      <option value="todos">Todos os meses</option>
      ${meses.map(m=>`<option value="${m}">${rotMes(m)}</option>`).join('')}
    </select>`;

  return `<div class="fech-wrap" style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      <h3 style="font-family:var(--fonte-display);font-size:15px;margin:0;">Fechamentos (planilha de comissões)</h3>
      ${selMes}
    </div>
    ${blocoTodos}
    ${blocosMes}
  </div>` + blocoFechamentosComercial();
}

// Tabela consolidada do COMERCIAL (soma de todos os consultores), separada por CONTRATO / EVENTUAL / ASSESSORIA.
// Não conta aditivos nem eventuais recicláveis (foraDoTotal). Filtro por mês OU por período (De/Até).
function blocoFechamentosComercial() {
  let fech = [];
  try { if (typeof finCarregar==='function') { finCarregar(); fech = (typeof FINdados!=='undefined' && FINdados.fechamentos) ? FINdados.fechamentos : []; } } catch(e) {}
  if (!fech.length) return '';
  const contam = fech.filter(f=>!f.foraDoTotal);
  const rotMes = (m)=> (typeof finRotMes==='function' && m) ? finRotMes(m) : m;
  const meses = [...new Set(contam.map(f=>f.mesRef).filter(m=>m&&!String(m).endsWith('-00')))].sort();
  const categoria = (t) => { const s=String(t||'').toUpperCase(); if(s.includes('ASSESSOR'))return 'ASSESSORIA'; if(s.includes('CONTRATO'))return 'CONTRATO'; if(s.includes('EVENTUAL'))return 'EVENTUAL'; return 'OUTROS'; };
  const cor = { CONTRATO:'var(--verde-medio)', EVENTUAL:'#185FA5', ASSESSORIA:'var(--roxo)', OUTROS:'var(--cinza-500)' };
  const nome = { CONTRATO:'Contrato', EVENTUAL:'Eventual', ASSESSORIA:'Assessoria', OUTROS:'Outros' };
  const montaTabela = (arr) => {
    const grupos = { CONTRATO:{n:0,v:0}, EVENTUAL:{n:0,v:0}, ASSESSORIA:{n:0,v:0}, OUTROS:{n:0,v:0} };
    arr.forEach(f=>{ const g=categoria(f.tipo); grupos[g].n++; grupos[g].v+=(f.valor||0); });
    const totN=arr.length, totV=arr.reduce((s,x)=>s+(x.valor||0),0);
    const ordem = ['CONTRATO','EVENTUAL','ASSESSORIA']; if(grupos.OUTROS.n>0) ordem.push('OUTROS');
    const linhas = ordem.map(g=>`<tr>
        <td style="padding:8px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cor[g]};margin-right:8px;"></span>${nome[g]}</td>
        <td style="text-align:right;">${grupos[g].n}</td>
        <td style="text-align:right;font-weight:600;">${fmtMoeda(grupos[g].v)}</td>
        <td style="text-align:right;color:var(--cinza-500);">${totV?(grupos[g].v/totV*100).toFixed(1):'0'}%</td>
      </tr>`).join('');
    return `<table style="width:100%;font-size:13px;border-collapse:collapse;">
      <thead><tr style="border-bottom:2px solid var(--cinza-200);"><th style="text-align:left;padding:8px 0;">Tipo</th><th style="text-align:right;">Fechamentos</th><th style="text-align:right;">Valor</th><th style="text-align:right;">% do total</th></tr></thead>
      <tbody>${linhas}
        <tr style="border-top:2px solid var(--cinza-200);"><td style="padding:8px 0;font-weight:700;">TOTAL</td><td style="text-align:right;font-weight:700;">${totN}</td><td style="text-align:right;font-weight:700;color:var(--verde-escuro);">${fmtMoeda(totV)}</td><td style="text-align:right;">100%</td></tr>
      </tbody></table>`;
  };
  const blocoTodos = `<div class="fcom-bloco" data-fcom="todos">${montaTabela(contam)}</div>`;
  const blocosMes = meses.map(m=>`<div class="fcom-bloco" data-fcom="${m}" style="display:none;">${montaTabela(contam.filter(f=>f.mesRef===m))}</div>`).join('');

  const selMes = `<select onchange="fcomFiltrar(this)" style="padding:6px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:12px;">

      ${meses.map(m=>`<option value="${m}">${rotMes(m)}</option>`).join('')}

      até <select class="fcom-ate" style="padding:5px 8px;border:1.5px solid var(--cinza-300);border-radius:6px;">${meses.map((m,i)=>`<option value="${m}" ${i===meses.length-1?'selected':''}>${rotMes(m)}</option>`).join('')}</select>

  return `<div class="fcom-wrap" data-fcom-json='${dadosJSON.replace(/'/g,"&#39;")}' style="background:white;border:1px solid var(--cinza-200);border-radius:12px;padding:20px;margin-top:18px;">

    ${periodoUI}
    ${blocoTodos}
    ${blocosMes}
    ${blocoPeriodo}
  </div>`;

function fcomFiltrar(sel) {
  const w = sel.closest('.fcom-wrap'); const v = sel.value;
  w.querySelector('.fcom-periodo-ui').style.display = (v==='periodo') ? 'flex' : 'none';
  w.querySelectorAll('.fcom-bloco').forEach(b=>{ b.style.display = b.getAttribute('data-fcom')===v ? 'block' : 'none'; });
}
function fcomCalcPeriodo(btn) {
  const w = btn.closest('.fcom-wrap');
  const de = w.querySelector('.fcom-de').value, ate = w.querySelector('.fcom-ate').value;
  let dados = []; try { dados = JSON.parse(w.getAttribute('data-fcom-json')||'[]'); } catch(e){}
  const ini = de<ate?de:ate, fim = de<ate?ate:de;
  const arr = dados.filter(d=> d.m>=ini && d.m<=fim );
  const grupos = { CONTRATO:{n:0,v:0}, EVENTUAL:{n:0,v:0}, ASSESSORIA:{n:0,v:0}, OUTROS:{n:0,v:0} };
  arr.forEach(d=>{ const g=grupos[d.t]||grupos.OUTROS; g.n++; g.v+=d.v; });
  const totN=arr.length, totV=arr.reduce((s,x)=>s+x.v,0);
  const cor = { CONTRATO:'var(--verde-medio)', EVENTUAL:'#185FA5', ASSESSORIA:'var(--roxo)', OUTROS:'var(--cinza-500)' };
  const nome = { CONTRATO:'Contrato', EVENTUAL:'Eventual', ASSESSORIA:'Assessoria', OUTROS:'Outros' };
  const ordem = ['CONTRATO','EVENTUAL','ASSESSORIA']; if(grupos.OUTROS.n>0) ordem.push('OUTROS');
  const linhas = ordem.map(g=>`<tr>
      <td style="padding:8px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cor[g]};margin-right:8px;"></span>${nome[g]}</td>
      <td style="text-align:right;">${grupos[g].n}</td>
      <td style="text-align:right;font-weight:600;">${fmtMoeda(grupos[g].v)}</td>
      <td style="text-align:right;color:var(--cinza-500);">${totV?(grupos[g].v/totV*100).toFixed(1):'0'}%</td>
    </tr>`).join('');
  const rotMes = (m)=> (typeof finRotMes==='function' && m) ? finRotMes(m) : m;
  w.querySelector('#fcom-periodo-alvo').innerHTML = `
    <div style="font-size:12px;color:var(--verde-escuro);font-weight:600;margin-bottom:8px;">${rotMes(ini)} até ${rotMes(fim)}</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;">
      <thead><tr style="border-bottom:2px solid var(--cinza-200);"><th style="text-align:left;padding:8px 0;">Tipo</th><th style="text-align:right;">Fechamentos</th><th style="text-align:right;">Valor</th><th style="text-align:right;">% do total</th></tr></thead>
      <tbody>${linhas}
        <tr style="border-top:2px solid var(--cinza-200);"><td style="padding:8px 0;font-weight:700;">TOTAL</td><td style="text-align:right;font-weight:700;">${totN}</td><td style="text-align:right;font-weight:700;color:var(--verde-escuro);">${fmtMoeda(totV)}</td><td style="text-align:right;">100%</td></tr>
      </tbody></table>`;
}

// converte uma data salva (dd/mm/aaaa ou ISO) para o formato do <input type=date> (aaaa-mm-dd)
function dataInputVal(v){ const d=parseDataReaj(v); if(!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// registra a proposta enviada numa COBERTURA — fica salvo, mas o lead continua como Cobertura (fora dos números)
async function salvarPropostaCobertura(idLead){
  const num=((document.getElementById('cobprop-num')||{}).value||'').trim();
  const data=(document.getElementById('cobprop-data')||{}).value||'';
  const valor=(document.getElementById('cobprop-valor')||{}).value||'';
  const campos={ PROPOSTA_COBERTURA:'Sim', NUM_PROPOSTA_COBERTURA:num, DATA_PROPOSTA_COBERTURA:(data?fmtDataBR(data):''), VALOR_PROPOSTA_COBERTURA:valor };
  try{
    const resp=await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'atualizarLeadCampos',token:sessaoToken,dados:{idLead:String(idLead),campos}})});
    const r=await resp.json();
    if(!r.ok){ alert('Não salvou: '+(r.erro||'verifique se o Apps Script foi republicado.')); return; }
    // recarrega os leads DO SERVIDOR pra refletir exatamente o que ficou gravado
    const it=(kanbanLeads||[]).find(x=>String(x['ID_LEAD'])===String(idLead)); if(it) Object.assign(it, campos);
    kanbanLeads=null; if(typeof carregarLeads==='function'){ try{ await carregarLeads(); }catch(e){} }
    const av=document.createElement('div'); av.textContent='Proposta de cobertura salva!'; av.style.cssText='position:fixed;bottom:20px;right:20px;background:#6B5B95;color:white;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;'; document.body.appendChild(av); setTimeout(()=>av.remove(),2000);
    abrirLead(idLead);
  }catch(e){ alert('Erro de conexão.'); }
}
async function removerPropostaCobertura(idLead){
  if(!confirm('Remover o registro de proposta enviada desta cobertura?')) return;
  const campos={ PROPOSTA_COBERTURA:'Não', NUM_PROPOSTA_COBERTURA:'', DATA_PROPOSTA_COBERTURA:'', VALOR_PROPOSTA_COBERTURA:'' };
  try{
    const resp=await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'atualizarLeadCampos',token:sessaoToken,dados:{idLead:String(idLead),campos}})});
    const r=await resp.json();
    if(!r.ok){ alert('Erro: '+(r.erro||'republique o Apps Script.')); return; }
    const it=(kanbanLeads||[]).find(x=>String(x['ID_LEAD'])===String(idLead)); if(it) Object.assign(it, campos);
    kanbanLeads=null; if(typeof carregarLeads==='function'){ try{ await carregarLeads(); }catch(e){} }
    abrirLead(idLead);
  }catch(e){ alert('Erro de conexão.'); }
}

// mostra clientes ativos na mesma região do CEP do lead
async function mostrarClientesProximos(cepLead, idLead) {
  const alvo = document.getElementById('lead-proximos');
  if (!alvo) return;
  const cep = String(cepLead||'').replace(/\D/g,'');
  if (cep.length < 5) {
    alvo.innerHTML = `<div style="background:var(--cinza-100);border-radius:10px;padding:12px;font-size:12px;color:var(--cinza-500);"><i class="ti ti-map-pin"></i> Preencha o CEP do lead (acima) para ver clientes próximos.</div>`;
    return;
  }
  // usa TODOS os clientes (não só os do vendedor) — a proximidade precisa enxergar a base inteira
  const todosClientes = await carregarClientesTodos();
  const lista = (todosClientes||[]).map(c => {
    const cc = String(c['CEP']||'').replace(/\D/g,'');
    if (cc.length < 5) return null;
    let nivel = 0;
    if (cc.slice(0,5) === cep.slice(0,5)) nivel = 3;       // mesma rua/quadra
    else if (cc.slice(0,4) === cep.slice(0,4)) nivel = 2;  // bem perto
    else if (cc.slice(0,3) === cep.slice(0,3)) nivel = 1;  // mesma região
    if (!nivel) return null;
    return { nome:c['CLIENTE'], cep:c['CEP'], endereco:c['ENDERECO'], cons:c['CONSULTOR'], nivel };
  }).filter(Boolean).sort((a,b)=>b.nivel-a.nivel).slice(0, 15);

  if (!lista.length) {
    alvo.innerHTML = `<div style="background:var(--cinza-100);border-radius:10px;padding:12px;font-size:12px;color:var(--cinza-500);"><i class="ti ti-map-pin"></i> Nenhum cliente ativo na mesma região de CEP (${cep.slice(0,5)}...).</div>`;
    return;
  }
  const selo = n => n===3 ? '<span style="background:#1f7a3d;color:white;font-size:9px;padding:1px 5px;border-radius:4px;">muito perto</span>'
    : n===2 ? '<span style="background:#4a8c5c;color:white;font-size:9px;padding:1px 5px;border-radius:4px;">perto</span>'
    : '<span style="background:#8bc34a;color:#2d5a3d;font-size:9px;padding:1px 5px;border-radius:4px;">mesma região</span>';
  alvo.innerHTML = `
    <div style="background:#F3F0FA;border-radius:10px;padding:12px;">
      <div style="font-size:12px;font-weight:600;color:#534877;margin-bottom:8px;"><i class="ti ti-map-pin"></i> Clientes próximos (CEP ${cep.slice(0,5)}...)</div>
      ${lista.map(c=>`<div style="padding:7px 0;border-bottom:1px solid rgba(0,0,0,0.06);font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;">
        <div><b style="color:var(--cinza-800);">${c.nome}</b><br><span style="color:var(--cinza-500);">${c.endereco||'—'} · CEP ${c.cep||'—'}${c.cons?' · '+c.cons:''}</span></div>
        <div style="white-space:nowrap;">${selo(c.nivel)}</div>
      </div>`).join('')}
    </div>`;
}

// excluir cliente duplicado (só Mafe/Andrea/Roberto) — vai para a lixeira, avisa se tem contratos
async function excluirCliente(cnpj, cliente) {
  if (!podeExcluirCliente()) return;
  const alvo = cnpjLimpo(cnpj);
  // checar contratos vinculados
  let nContratos = 0;
  try {
    const rc = await buscarDados('Contratos');
    nContratos = (rc.ok?rc.linhas:[]).filter(x=>cnpjLimpo(x['CNPJ'])===alvo).length;
  } catch(e) {}
  let aviso = `Excluir o cliente "${cliente}"?\n\nEle vai para a Lixeira de Clientes (recuperável).`;
  if (nContratos > 0) {
    aviso += `\n\n⚠️ ATENÇÃO: este cliente tem ${nContratos} contrato(s) vinculado(s). Os contratos NÃO serão excluídos — eles continuarão na aba Contratos. Confira se não está excluindo o cliente errado.`;
  }
  if (!confirm(aviso)) return;
  // segunda confirmação se tiver contratos
  if (nContratos > 0 && !confirm(`Confirma mesmo a exclusão de "${cliente}" (com ${nContratos} contrato[s])?`)) return;
  try {
    const resp = await fetch(API_URL, { method:'POST', body: JSON.stringify({
      acao:'excluirCliente', token: sessaoToken, dados:{ cnpj, nomeUsuario: usuarioAtual.nome }

let FINdados = { pagar:[], receber:[], recebeReceb:[], fechamentos:[], coletas:[], faturamento:[] };
const FIN_LS_KEY = 'ecotrans_fin_testes';

function finSalvar(){ try{ localStorage.setItem(FIN_LS_KEY, JSON.stringify(FINdados)); }catch(e){} }
function finCarregar(){
  try{ const d=localStorage.getItem(FIN_LS_KEY); if(d) FINdados=JSON.parse(d); }catch(e){}
  // garante que todos os campos existem (evita erro se o dado salvo é de uma versão antiga)
  if(!FINdados || typeof FINdados!=='object') FINdados={};

}
// após processar um upload, REESCREVE aquela aba inteira no Sheets com o conteúdo atual da memória.
// A memória já acumula os meses corretamente (o processamento substitui só o mês do arquivo).
// Reescrever a aba inteira elimina a duplicação que vinha de "remendar período por período".
async function finSincronizarAposUpload(tipoDados, st){
  const cfg = FIN_MAPA_SHEETS[tipoDados];
  if (!cfg) return;
  try {
    if (st) { st.textContent = 'Salvando no sistema (compartilhado)...'; st.style.color='var(--cinza-500)'; }
    // COLETAS: manda só os meses que vieram no arquivo, em vez de reescrever a aba inteira.
    // Com dois meses carregados eram ~80 idas ao servidor a cada upload; agora são poucas,
    // porque os meses antigos ficam onde estão.
    if (tipoDados==='coletas' && Array.isArray(st && st._mesesEnviar) && st._mesesEnviar.length) {
      for (const ym of st._mesesEnviar) await finEnviarSheets('coletas', ym, st);
    } else {
      // demais relatórios: reescreve a aba inteira do tipo (a memória é a fonte da verdade)
      await finEnviarSheetsCompleto(tipoDados, st);
    }
    if (st) { st.textContent = 'Salvo! Todos da equipe já veem estes dados.'; st.style.color='var(--verde-medio)'; }
    if (typeof finInvalidarCache==='function') finInvalidarCache();
  } catch(e){
    if (st) { st.innerHTML = 'Processado, mas <b>falhou ao salvar no sistema</b>. Verifique a conexão e o Apps Script.<br><span style="font-size:11px;">'+e.message+'</span>'; st.style.color='var(--vermelho)'; }
  }
}

// reescreve a aba inteira do tipo no Sheets (modo 'tudo'), em lotes. Fonte = memória (FINdados[tipo]).
async function finEnviarSheetsCompleto(tipo, statusEl){
  const cfg = FIN_MAPA_SHEETS[tipo];
  if (!cfg) return;
  let linhas = (FINdados[tipo]||[]).slice();
  if (tipo==='faturamento') linhas = linhas.map(x=>({ cliente:x.cliente, valoresJSON: JSON.stringify(x.valores||{}) }));
  // colunas = UNIÃO de todas as chaves de todos os registros (não só do primeiro).
  // Assim campos como ISS/INSS que possam faltar no 1º título ainda são enviados.
  const setCols = new Set();
  linhas.forEach(l=>Object.keys(l).forEach(k=>setCols.add(k)));
  const colunas = setCols.size ? [...setCols] : ['vazio'];
  const LOTE = 500; // cada ida ao servidor custa ~1-3s; lotes maiores = muito menos espera
  // se não há nada, manda um lote vazio em modo 'tudo' pra limpar a aba
  if (!linhas.length){
    await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarFinanceiro',token:sessaoToken,
      dados:{ aba:cfg.aba, colunas, linhas:[], modo:'tudo', primeiroLote:true }})});
    return;
  }
  let primeiro = true;
  for (let i=0;i<linhas.length;i+=LOTE){
    const lote = linhas.slice(i,i+LOTE);
    if (statusEl) { const feito=Math.min(i+LOTE,linhas.length); statusEl.innerHTML = `Salvando no sistema: <b>${feito.toLocaleString('pt-BR')} de ${linhas.length.toLocaleString('pt-BR')}</b> (${Math.round(feito/linhas.length*100)}%)<div style="font-size:11px;color:var(--cinza-500);">Pode deixar a aba aberta — é normal demorar quando o mês é grande.</div>`; }
    await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarFinanceiro',token:sessaoToken,
      dados:{ aba:cfg.aba, colunas, linhas:lote, modo:'tudo', primeiroLote:primeiro }})});
    primeiro = false;
  }
}

// ===== SINCRONIZAÇÃO COM O GOOGLE SHEETS (financeiro compartilhado) =====
// Mapa: qual aba do Sheets, quais colunas e qual a regra de substituição de cada tipo.
const FIN_MAPA_SHEETS = {
  pagar:       { aba:'Fin_Pagar',            campoPeriodo:'_mesPagamento' },
  receber:     { aba:'Fin_Receber_Emitidos', campoPeriodo:'_mesEmissao' },
  recebeReceb: { aba:'Fin_Receber_Recebidos',campoPeriodo:'_mesEmissao' },
  fechamentos: { aba:'Fin_Fechamentos',      campoPeriodo:'mesRef' },
  coletas:     { aba:'Fin_Coletas',          campoPeriodo:'ym' },
  faturamento: { aba:'Fin_Faturamento',      campoPeriodo:null }, // substitui tudo
};

// envia os dados de um tipo para o Sheets, em lotes, substituindo o período informado.
async function finEnviarSheets(tipo, valorPeriodo, statusEl){
  const cfg = FIN_MAPA_SHEETS[tipo];
  if (!cfg) return;
  let linhas = (FINdados[tipo]||[]).slice();
  // para faturamento, o objeto tem 'valores' (mapa de meses) — serializa pra caber numa célula
  if (tipo==='faturamento') linhas = linhas.map(x=>({ cliente:x.cliente, valoresJSON: JSON.stringify(x.valores||{}) }));
  // se substitui por período, filtra só as linhas do período que está subindo
  let aEnviar = linhas;
  if (cfg.campoPeriodo && valorPeriodo!=null) aEnviar = linhas.filter(l=>String(l[cfg.campoPeriodo])===String(valorPeriodo));
  const colunas = aEnviar.length ? Object.keys(aEnviar[0]) : (linhas.length?Object.keys(linhas[0]):['vazio']);
  const LOTE = 500; // cada ida ao servidor custa ~1-3s; lotes maiores = muito menos espera
  const modo = cfg.campoPeriodo ? 'periodo' : 'tudo';
  let primeiro = true;
  if (!aEnviar.length) {
    // nada a enviar, mas ainda assim limpa o período (ex: período ficou vazio)
    await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarFinanceiro',token:sessaoToken,
      dados:{ aba:cfg.aba, colunas, linhas:[], modo, campoPeriodo:cfg.campoPeriodo, valorPeriodo, primeiroLote:true }})});
    return;
  }
  for (let i=0;i<aEnviar.length;i+=LOTE){
    const lote = aEnviar.slice(i,i+LOTE);
    if (statusEl) statusEl.textContent = `Enviando ${Math.min(i+LOTE,aEnviar.length)} de ${aEnviar.length}...`;
    await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarFinanceiro',token:sessaoToken,
      dados:{ aba:cfg.aba, colunas, linhas:lote, modo, campoPeriodo:cfg.campoPeriodo, valorPeriodo, primeiroLote:primeiro }})});
    primeiro = false;
  }
}

// carrega todos os tipos do Sheets para o FINdados (chamado ao abrir o módulo)
// carrega tipos do Sheets para o FINdados. Otimizado:
// - só os tipos pedidos (cada tela pede o que precisa), não as 6 abas sempre
// - em PARALELO (Promise.all), não uma requisição após a outra
// - com cache de 90s (não refaz se carregou há pouco), salvo se forcar=true
let _finCarregadoEm = {}; // tipo -> timestamp
async function finCarregarDoSheets(tipos, forcar){
  const alvos = (tipos && tipos.length) ? tipos : Object.keys(FIN_MAPA_SHEETS);
  const agora = Date.now();
  const aBuscar = alvos.filter(t => forcar || !_finCarregadoEm[t] || (agora - _finCarregadoEm[t] > 90000));
  if (!aBuscar.length) return; // tudo fresco no cache, não busca nada
  await Promise.all(aBuscar.map(async (tipo) => {
    const cfg = FIN_MAPA_SHEETS[tipo];
    if (!cfg) return;
    try {
      const resp = await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'dados',token:sessaoToken,aba:cfg.aba})});
      const r = await resp.json();
      if (r.ok && r.linhas){
        if (tipo==='faturamento'){
          FINdados[tipo] = r.linhas.map(l=>({ cliente:l.cliente, valores: (()=>{try{return JSON.parse(l.valoresJSON||'{}')}catch(e){return {}}})() }));
        } else {
          FINdados[tipo] = r.linhas.map(l=>{
            const o = {...l};
            ['valor','pago','saldo','recebido','qtdeServ','pesoTon','minimaServ','minimaTaxa','semana','iss','inss','pis','cofins','csll','ir','desconto','liquido'].forEach(k=>{ if(o[k]!==undefined&&o[k]!=='') o[k]=finN(o[k]); });
            if(o.foraDoTotal!==undefined) o.foraDoTotal = (o.foraDoTotal===true||o.foraDoTotal==='true'||o.foraDoTotal==='Sim');
            return o;
          });
        }
      }
      _finCarregadoEm[tipo] = Date.now();
    } catch(e){ /* aba pode não existir ainda */ }
  }));
  finSalvar();
}
// invalida o cache de leitura do financeiro (chamar após enviar dados novos)
function finInvalidarCache(){ _finCarregadoEm = {}; }

function finFmtM(v){ const n=parseFloat(v)||0; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
// converte valor que pode vir como número (já certo) ou texto BR ("1.234,56")
function finParseValorBR(v){
  if(typeof v==='number') return v; // já é número, usa direto
  let s=String(v||'').trim(); if(!s) return 0;
  // texto BR: remove separador de milhar (.) e troca vírgula decimal por ponto
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  s=s.replace(/[^\d.-]/g,'');
  return parseFloat(s)||0;
}
function finLc(s){ return String(s==null?'':s).replace(/\u00a0/g,' ').trim(); }
// converte valor (número, "1.234,56" BR, "1,234.56" US, "197.16") para float de forma robusta
function finN(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  let s=String(v).replace(/[^0-9,.-]/g,'');
  if(s==='')return 0;
  const temV=s.includes(','), temP=s.includes('.');
  if(temV&&temP){
    // o separador decimal é o que aparece por último
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); // BR: 1.234,56
    else s=s.replace(/,/g,''); // US: 1,234.56
  } else if(temV){
    s=s.replace(',','.'); // só vírgula = decimal BR
  }
  // só ponto: já é decimal válido (197.16) — não mexe
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function finNormNome(s){ return finLc(s).toUpperCase().replace(/\([^)]*\)/g,'').replace(/[^A-Z0-9 ]/g,'').replace(/\b(LTDA|SA|EIRELI|ME|EPP|THE|NEW|DO BRASIL)\b/g,'').replace(/\s+/g,' ').trim().slice(0,18); }

// ============ LEITURA DOS ARQUIVOS (com deduplicação) ============
function FIN_lerArquivo(input, tipo){
  const file = input.files[0]; if(!file) return;
  const st = document.getElementById('st-'+tipo);
  st.textContent = 'Lendo...';
  // relatório de serviços é CSV (latin-1) — lê como texto
  if (tipo === 'servicos') {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        // NÃO baixamos a aba de coletas antes de processar: o envio agora é por mês,
        // então os meses antigos ficam intactos no servidor sem precisar passar por aqui.
        // (esse download de 12.000 linhas antes de cada upload era puro desperdício)
        FIN_processarServicos(e.target.result, st);
        finSalvar(); finAtualizarTudo();
        document.getElementById('ub-servicos').classList.add('ok');
        await finSincronizarAposUpload('coletas', st);
      } catch(err) { st.innerHTML='Erro ao ler: '+err.message; st.style.color='var(--vermelho)'; }
    };
    reader.readAsText(file, 'ISO-8859-1'); // latin-1
    return;
  }
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const arr = new Uint8Array(e.target.result);
      let wb;
      try {
        wb = XLSX.read(arr, {type:'array', cellStyles:false, cellHTML:false, cellFormula:false, sheetStubs:false, bookVBA:false});
      } catch(err1) {
        wb = await FIN_lerViaRecompactacaoNativa(arr);
      }
      // garante que a memória tem TODOS os meses já salvos antes de processar o novo arquivo
      // (senão, ao reescrever a aba, perderíamos meses que estavam só no Sheets)
      const tipoBase = (tipo==='comissao') ? 'fechamentos' : tipo;
      try { await finCarregarDoSheets([tipoBase], true); } catch(e){}
      if(tipo==='pagar') FIN_processarPagar(wb, st);
      else if(tipo==='receber') FIN_processarReceber(wb, st, 'receber');
      else if(tipo==='recebeReceb') FIN_processarReceber(wb, st, 'recebeReceb');
      else if(tipo==='comissao') FIN_processarComissao(wb, st, file.name);
      else if(tipo==='faturamento') FIN_processarFaturamentoVar(wb, st);
      finSalvar(); finAtualizarTudo();
      document.getElementById('ub-'+tipo).classList.add('ok');
      // envia pro Sheets (compartilhado). 'comissao' guarda em FINdados.fechamentos.
      const tipoDados = tipoBase;
      await finSincronizarAposUpload(tipoDados, st);
    }catch(err){
      st.innerHTML='Não consegui ler o arquivo. <b>Dica:</b> abra no Excel/Google Sheets e use "Salvar como" → .xlsx, depois suba de novo.<br><span style="font-size:11px;">Detalhe: '+err.message+'</span>';
      st.style.color='var(--vermelho)';
    }
  };
  reader.readAsArrayBuffer(file);
}

// Recompacta um .xlsx "meio quebrado" sem depender de biblioteca externa.
async function FIN_lerViaRecompactacaoNativa(arr){
  const arquivos = await FIN_descompactarZipNativo(arr);
  return XLSX.read(FIN_montarZipSimples(arquivos), {type:'array', cellStyles:false, cellFormula:false, bookVBA:false});
}

// lê as entradas de um ZIP usando DecompressionStream (nativo do navegador)
async function FIN_descompactarZipNativo(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const td = new TextDecoder();
  const arquivos = {};
  let i = 0;
  while (i < bytes.length - 4) {
    const sig = dv.getUint32(i, true);
    if (sig !== 0x04034b50) break;
    const method = dv.getUint16(i+8, true);
    const compSize = dv.getUint32(i+18, true);
    const nameLen = dv.getUint16(i+26, true);
    const extraLen = dv.getUint16(i+28, true);
    const nameStart = i + 30;
    const nome = td.decode(bytes.subarray(nameStart, nameStart+nameLen));
    const dataStart = nameStart + nameLen + extraLen;
    const comp = bytes.subarray(dataStart, dataStart + compSize);
    if (!nome.endsWith('/')) {
      let conteudo;
      if (method === 0) conteudo = comp.slice();
      else if (method === 8) conteudo = await FIN_inflaRaw(comp);
      else conteudo = comp.slice();
      arquivos[nome] = conteudo;
    }
    i = dataStart + compSize;
  }
  if (!Object.keys(arquivos).length) throw new Error('não foi possível abrir o arquivo (formato inesperado).');
  return arquivos;
}

async function FIN_inflaRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Response(new Blob([bytes])).body.pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

// remonta um ZIP simples (tudo STORE) que o SheetJS lê sem problema
function FIN_montarZipSimples(arquivos){
  const enc = new TextEncoder();
  const partes = []; const central = []; let offset = 0; let nCentral = 0;
  function u16(n){ return [n&255,(n>>8)&255]; }
  function u32(n){ return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]; }
  function crc32(buf){ let c=~0; for(let i=0;i<buf.length;i++){ c^=buf[i]; for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320&-(c&1)); } return ~c>>>0; }
  for (const nome in arquivos){
    const nomeB = enc.encode(nome);
    const data = arquivos[nome];
    const crc = crc32(data);
    const lh = [...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nomeB.length),...u16(0)];
    partes.push(new Uint8Array(lh), nomeB, data);
    const ch = [...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nomeB.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)];
    central.push(new Uint8Array(ch), nomeB);
    offset += lh.length + nomeB.length + data.length; nCentral++;
  }
  let centralSize=0; central.forEach(p=>centralSize+=p.length);
  const eocd = new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(nCentral),...u16(nCentral),...u32(centralSize),...u32(offset),...u16(0)]);
  const todas=[...partes,...central,eocd];
  let tam=0; todas.forEach(p=>tam+=p.length);
  const out=new Uint8Array(tam); let pos=0;
  todas.forEach(p=>{ out.set(p,pos); pos+=p.length; });
  return out;
}

function finAchaCol(cols, ...termos){
  return cols.find(c => { const u=finLc(c).toUpperCase(); return termos.every(t=>u.includes(t.toUpperCase())); });
}

function FIN_processarPagar(wb, st){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
  if(!rows.length){ st.textContent='Planilha vazia.'; return; }
  const cols = Object.keys(rows[0]);
  const cTit=finAchaCol(cols,'Título')||finAchaCol(cols,'Titulo');
  const cPag=finAchaCol(cols,'Pagamento');
  // cada arquivo é o retrato completo de UM mês. Substitui só os meses presentes no arquivo
  // (mantém os outros meses já carregados). Assim dá pra acumular maio, junho... sem duplicar.
  const mesesNoArquivo = new Set();
  rows.forEach(r=>{ const ym=finYmDeData(finLc(r[cPag])); if(ym) mesesNoArquivo.add(ym); });
  if (mesesNoArquivo.size) FINdados.pagar = FINdados.pagar.filter(x=>!mesesNoArquivo.has(x._mesPagamento||finYmDeData(x.pagamento)));
  const jaTem = new Set(FINdados.pagar.map(x=>String(x.titulo)));
  let novos=0;
  rows.forEach(r=>{
    const tit = String(r[cTit]||'').trim();
    if(!tit || jaTem.has(tit)) return;
    // desconsidera "DISTRIBUIÇÃO DE LUCROS" (não é despesa operacional)
    const centroRaw = finLc(r[finAchaCol(cols,'Custo')]);
    const despesaRaw = finLc(r[finAchaCol(cols,'Despesa')]);
    const semAcento = s => String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if (semAcento(centroRaw).includes('DISTRIBUICAO DE LUCROS') || semAcento(despesaRaw).includes('DISTRIBUICAO DE LUCROS')) return;
    FINdados.pagar.push({
      titulo:tit,
      fornecedor:finLc(r[finAchaCol(cols,'Fornecedor')]),
      centro:centroRaw||'(sem centro)',
      despesa:despesaRaw||'(sem despesa)',
      situacao:finLc(r[finAchaCol(cols,'Situação')]||r[finAchaCol(cols,'Situacao')]),
      competencia:finLc(r[finAchaCol(cols,'Competência')]||r[finAchaCol(cols,'Competencia')]),
      emissao:finLc(r[finAchaCol(cols,'Emissão')]||r[finAchaCol(cols,'Emissao')]),
      vencimento:finLc(r[finAchaCol(cols,'Vencimento')]),
      pagamento:finLc(r[finAchaCol(cols,'Pagamento')]),
      valor:parseFloat(r[finAchaCol(cols,'Valor')])||0,
      pago:parseFloat(r[finAchaCol(cols,'Vlr. Pago')]||r[finAchaCol(cols,'Pago')])||0,
      saldo:parseFloat(r[finAchaCol(cols,'Saldo')])||0,
      _mesPagamento: finYmDeData(finLc(r[finAchaCol(cols,'Pagamento')]))||''
    });
    jaTem.add(tit); novos++;
  });
  st.textContent = `${novos} títulos novos adicionados (${FINdados.pagar.length} no total).`; st.style.color='var(--verde-medio)';
}

function FIN_processarReceber(wb, st, destino){
  destino = destino || 'receber';
  let ws=null;
  for(const nome of wb.SheetNames){
    const test=XLSX.utils.sheet_to_json(wb.Sheets[nome],{defval:''});
    if(test.length && Object.keys(test[0]).some(c=>finLc(c).toUpperCase()==='CLIENTE')){ ws=wb.Sheets[nome]; break; }
  }
  if(!ws) ws=wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!rows.length){ st.textContent='Planilha vazia.'; return; }
  const cols=Object.keys(rows[0]);
  const cTit=finAchaCol(cols,'Título')||finAchaCol(cols,'Titulo');
  const cEmi=finAchaCol(cols,'Emissão')||finAchaCol(cols,'Emissao');
  // cada arquivo é o retrato completo de UM mês. Antes de adicionar, remove da memória
  // TODOS os títulos que estão neste arquivo (por número) — assim nunca duplica, mesmo que
  // a data/mês tenha voltado do Sheets num formato diferente.
  const mesesNoArquivo = new Set();
  const titulosNoArquivo = new Set();
  rows.forEach(r=>{
    const ym=finYmDeData(finLc(r[cEmi])); if(ym) mesesNoArquivo.add(ym);
    const t=String(r[cTit]||'').trim().replace(/\.0+$/,''); if(t) titulosNoArquivo.add(t);
  });
  const norTit = x => String(x==null?'':x).trim().replace(/\.0+$/,'');
  // remove: (a) títulos dos meses presentes no arquivo, E (b) qualquer título que esteja no arquivo
  FINdados[destino] = FINdados[destino].filter(x=>{
    const mesX = x._mesEmissao||finYmDeData(x.emissao);
    if (mesesNoArquivo.size && mesesNoArquivo.has(mesX)) return false; // mesmo mês -> será resubstituído
    if (titulosNoArquivo.has(norTit(x.titulo))) return false; // mesmo título -> evita duplicata
    return true;
  });
  const alvo2 = FINdados[destino];
  const jaTem=new Set(alvo2.map(x=>norTit(x.titulo)));
  let novos=0;
  rows.forEach(r=>{
    const tit=String(r[cTit]||'').trim();
    const titN=norTit(tit);
    if(!tit || jaTem.has(titN)) return;
    const cliRaw=finLc(r[finAchaCol(cols,'Cliente')]);
    const cnpjM=cliRaw.match(/(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/);
    alvo2.push({
      titulo:tit,
      cnpj:cnpjM?cnpjM[1]:'',
      cliente:cliRaw.replace(/\(?(CNPJ|CPF)[:\s]*[\d.\/-]+\)?/gi,'').trim(),
      situacao:finLc(r[finAchaCol(cols,'Situação')]||r[finAchaCol(cols,'Situacao')]),
      competencia:finLc(r[finAchaCol(cols,'Competência')]||r[finAchaCol(cols,'Competencia')]),
      emissao:finLc(r[finAchaCol(cols,'Emissão')]||r[finAchaCol(cols,'Emissao')]),
      vencimento:finLc(r[finAchaCol(cols,'Vencimento')]),
      valor:parseFloat(r[finAchaCol(cols,'Valor')])||0,
      recebido:parseFloat(r[finAchaCol(cols,'Vlr. Recebido')]||r[finAchaCol(cols,'Recebido')])||0,
      saldo:parseFloat(r[finAchaCol(cols,'Saldo')])||0,
      // impostos e líquido (o relatório já traz cada um)
      iss:finN(r[finAchaCol(cols,'ISS')]),
      inss:finN(r[finAchaCol(cols,'INSS')]),
      pis:finN(r[finAchaCol(cols,'Pis')]||r[finAchaCol(cols,'PIS')]),
      cofins:finN(r[finAchaCol(cols,'Cofins')]||r[finAchaCol(cols,'COFINS')]),
      csll:finN(r[finAchaCol(cols,'Csll')]||r[finAchaCol(cols,'CSLL')]),
      ir:finN(r[finAchaCol(cols,'IR')]),
      desconto:finN(r[finAchaCol(cols,'Desconto')]),
      liquido:finN(r[finAchaCol(cols,'Vlr. Líquido')]||r[finAchaCol(cols,'Vlr. Liquido')]||r[finAchaCol(cols,'Líquido')]),
      _mesEmissao: finYmDeData(finLc(r[finAchaCol(cols,'Emissão')]||r[finAchaCol(cols,'Emissao')]))||''
    });
    jaTem.add(titN); novos++;
  });
  // dedup final de segurança: garante um único registro por título (elimina qualquer duplicata remanescente)
  const vistos = new Set();
  FINdados[destino] = FINdados[destino].filter(x=>{ const t=norTit(x.titulo); if(vistos.has(t)) return false; vistos.add(t); return true; });
  st.textContent=`${novos} títulos carregados (substituiu o anterior).`; st.style.color='var(--verde-medio)';
}

// extrai o mês/ano (YYYY-MM) do nome do arquivo de comissão.
// Aceita "05_2026_Maio_2026.xlsx", "Maio 2026", "2026-05", "05-2026", etc.
function FIN_mesDoNomeArquivo(nome){
  const s = String(nome||'').toLowerCase().replace(/\.xlsx?$/,'');
  const anoM = s.match(/20\d{2}/);
  const ano = anoM ? anoM[0] : String(new Date().getFullYear());
  // tenta nome do mês por extenso
  for (const nm in FIN_MESES) { if (s.includes(nm)) return ano+'-'+FIN_MESES[nm]; }
  // tenta número de mês (01..12) próximo ao início ou junto do ano
  const numM = s.match(/(?:^|[^0-9])(0[1-9]|1[0-2])(?:[^0-9]|$)/);
  if (numM) return ano+'-'+numM[1];
  return ano+'-00'; // não identificado
}

function FIN_processarComissao(wb, st, nomeArquivo){
  const jaTem=new Set(FINdados.fechamentos.map(x=>x.chave));
  let novos=0;
  // extrai mês/ano do NOME DO ARQUIVO (ex: "05_2026_Maio_2026.xlsx" -> 2026-05)
  const mesArquivo = FIN_mesDoNomeArquivo(nomeArquivo || '');
  wb.SheetNames.forEach(nomeAba=>{
    if(nomeAba.toLowerCase()==='rascunho') return;
    const consultor=nomeAba;
    const grade=XLSX.utils.sheet_to_json(wb.Sheets[nomeAba],{header:1,defval:''});
    let hrow=-1;
    for(let i=0;i<grade.length;i++){ if(grade[i].some(v=>finLc(v).toUpperCase()==='CLIENTE')){ hrow=i; break; } }
    if(hrow<0) return;
    const cab=grade[hrow].map(v=>finLc(v).toUpperCase());
    const iCli=cab.findIndex(c=>c==='CLIENTE');
    const iData=cab.findIndex(c=>c.includes('DATA'));
    const iTipo=cab.findIndex(c=>c.includes('TIPO'));
    const iVal=cab.findIndex(c=>c.includes('VALOR'));
    for(let i=hrow+1;i<grade.length;i++){
      const cli=finLc(grade[i][iCli]); const tipo=finLc(grade[i][iTipo]).toUpperCase();
      const su=cli.toUpperCase();
      if(!cli || su.startsWith('TOTAL') || su.startsWith('___') || su.includes('ROBERTO FERNANDES') || su.includes('ANDREA')) continue;
      if(!tipo || tipo.includes('CARTEIRA')) continue;
      const valor=parseFloat(grade[i][iVal])||0;
      const dataRaw=grade[i][iData];
      // aditivos e eventuais recicláveis: aparecem pro diretor, mas NÃO entram no total comercial
      const foraDoTotal = tipo.includes('ADITIVO') || (tipo.includes('RECIC'));
      const chave = (mesArquivo||'')+'|'+consultor+'|'+finNormNome(cli)+'|'+tipo+'|'+valor;
      if(jaTem.has(chave)) continue;
      FINdados.fechamentos.push({ chave, consultor, cliente:cli, tipo, valor, data:finLc(dataRaw), mesArq:nomeAba, mesRef: mesArquivo, foraDoTotal });
      jaTem.add(chave); novos++;
    }
  });
  st.textContent=`${novos} fechamentos novos adicionados (${FINdados.fechamentos.length} no total).`; st.style.color='var(--verde-medio)';
}

// processa o relatório de serviços (CSV). Conta Qtde-Serviço (equipamentos) e Qtde-Taxa (peso ton,
// só p/ caçamba/roll-on/compactadora). Ignora cabeçalhos repetidos e linhas de resumo.
// Deduplica por Num. Interno (identificador único de cada coleta).
function FIN_processarServicos(texto, st){
  // ============================================================
  // Importador do RELATÓRIO DE SERVIÇOS (.csv, separador ;)
  //
  // Duas medidas, porque são coisas diferentes:
  //   COLETADO = o que a equipe realmente recolheu no mês
  //   FATURADO = o que o cliente paga (respeita a mínima do contrato)
  //
  // O relatório já traz uma "linha de complemento de mínima": quando o
  // cliente coleta menos que a mínima, aparece uma linha extra no último dia
  // do mês fechando a conta. Ex.: La Braciera Matriz em junho — 20 coletas
  // somando 149 sacos + 1 linha de 151 no dia 30 = 300, que é a mínima.
  // Aqui essa linha é identificada e marcada, pra não contar como coleta.
  // ============================================================
  const linhas = texto.split(/\r?\n/).filter(l=>l.trim());
  if (!linhas.length) { st.textContent='Arquivo vazio.'; return; }
  const parseLinha = l => l.split(';').map(c=>c.trim().replace(/^"|"$/g,''));
  const cab = parseLinha(linhas[0]).map(c=>c.replace(/﻿/g,''));
  const norm = s => String(s).toLowerCase().replace(/ç/g,'c').replace(/ã|á|à/g,'a').replace(/é|ê/g,'e').replace(/í/g,'i').replace(/ó|ô/g,'o').replace(/ú/g,'u');
  const acha = termo => cab.findIndex(c => norm(c).includes(norm(termo)));
  // O layout do relatório MUDA entre exportações (junho veio com 35 colunas,
  // julho com 36). Por isso toda coluna é localizada pelo NOME, nunca pela posição.
  const iCli=acha('cliente'), iCnpj=acha('cnpj'), iClasse=acha('classe'),
        iStatus=acha('status'), iEquip=acha('tipo de equip'), iResiduo=acha('residuo'),
        iEnd=acha('end. de coleta'), iContrato=acha('contrato'), iFreq=acha('frequencia');
  // "Data" tem que ser exata: existe também "Data de Descarte", que não serve.
  let iData = cab.findIndex(c => norm(c).trim()==='data');
  if (iData < 0) iData = acha('data');
  let iQServ=-1, iMinServ=-1, iQTaxa=-1, iMinTaxa=-1, iTipoServ=-1;
  cab.forEach((c,i)=>{ const n=norm(c);
    if(n.includes('qtde')&&n.includes('serv')) iQServ=i;
    if(n.includes('minima')&&n.includes('serv')) iMinServ=i;
    if(n.includes('qtde')&&n.includes('taxa')) iQTaxa=i;
    if(n.includes('minima')&&n.includes('taxa')) iMinTaxa=i;
    if(n.includes('tipo')&&n.includes('- serv')) iTipoServ=i;
  });
  if (iQServ<0 || iData<0 || iCli<0 || iCnpj<0) {
    st.innerHTML='Não reconheci as colunas deste arquivo (preciso de Cliente, CNPJ, Data e "Qtde. - Serviço"). Exporte de novo pelo mesmo caminho de sempre.';
    st.style.color='var(--vermelho)'; return;
  }
  const numColsCab = cab.length;
  const reCnpj = /^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/;
  const reData = /^(\d{2})\/(\d{2})\/(\d{2,4})/;
  const EQUIP_PESO = ['cacamba','caçamba','roll on','roll-on','rollon','compactadora','brooks'];
  const num2 = v => { let s=String(v||'').replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''); const n=parseFloat(s); return isNaN(n)?0:n; };

  // 1) lê as linhas válidas do arquivo
  const novas = [];
  const mesesNoArquivo = new Set();
  let ignoradas = 0;
  linhas.slice(1).forEach((l, ordem)=>{
    const row = parseLinha(l);
    if (row.length < numColsCab-2) { ignoradas++; return; }        // linha de resumo/rodapé
    const cnpj = (row[iCnpj]||'').trim();
    if (!reCnpj.test(cnpj)) { ignoradas++; return; }                // cabeçalho repetido ou linha solta
    const md = String(row[iData]||'').match(reData);
    if (!md) { ignoradas++; return; }
    const status = norm(row[iStatus]||'');
    if (!status.includes('conclu') && !status.includes('liberad')) { ignoradas++; return; }
    const ano = md[3].length===2 ? '20'+md[3] : md[3];
    const dataISO = `${ano}-${md[2]}-${md[1]}`;
    const ym = `${ano}-${md[2]}`;
    mesesNoArquivo.add(ym);
    const dt = new Date(parseInt(ano), parseInt(md[2])-1, parseInt(md[1]));
    const equip = (row[iEquip]||'').trim();
    const ehPeso = EQUIP_PESO.some(e=>norm(equip).includes(norm(e)));
    novas.push({
      num: cnpj+'|'+dataISO+'|'+equip+'|'+ordem,   // identificador estável da LINHA (não da OS)
      cnpj, cliente:(row[iCli]||'').trim(),
      contrato: iContrato>=0 ? (row[iContrato]||'').trim() : '',
      equip, tipoServ: iTipoServ>=0 ? (row[iTipoServ]||'').trim() : equip,
      classe:(row[iClasse]||'').trim(), residuo:(row[iResiduo]||'').trim(),
      endereco: iEnd>=0 ? (row[iEnd]||'').trim() : '',
      data: dataISO, ym, semana: FIN_semanaDoMes(dt), ordem,
      qtdeServ: num2(row[iQServ]),
      minimaServ: iMinServ>=0 ? num2(row[iMinServ]) : 0,
      pesoTon: (ehPeso && iQTaxa>=0) ? num2(row[iQTaxa]) : 0,
      minimaTaxa: (ehPeso && iMinTaxa>=0) ? num2(row[iMinTaxa]) : 0,
      ehCompl: false
    });
  });
  if (!novas.length) { st.innerHTML='Não encontrei nenhuma coleta válida neste arquivo. Verifique se é o Relatório de Serviços e se ele veio completo.'; st.style.color='var(--vermelho)'; return; }

  // 2) marca a LINHA DE COMPLEMENTO DE MÍNIMA de cada cliente/serviço/mês.
  //    Regra: o total do mês bate exatamente com a mínima, a última linha é a
  //    que fez o total chegar lá, e ela divide a data com outra linha (é o
  //    acerto lançado junto da última coleta).
  const grupos = {};
  novas.forEach(c=>{ const k=c.cliente+'||'+c.tipoServ+'||'+c.ym; (grupos[k]=grupos[k]||[]).push(c); });
  let nCompl = 0;
  Object.values(grupos).forEach(g=>{
    const minima = Math.max(...g.map(x=>x.minimaServ||0));
    if (!(minima > 0)) return;
    const total = g.reduce((s,x)=>s+x.qtdeServ,0);
    if (Math.abs(total-minima) > 0.001) return;         // não fechou na mínima: nada a marcar
    g.sort((a,b)=> a.data===b.data ? a.ordem-b.ordem : (a.data<b.data?-1:1));
    const ult = g[g.length-1];
    const semUlt = total - ult.qtdeServ;
    const dividiData = g.filter(x=>x.data===ult.data).length > 1;
    if (semUlt < minima - 0.001 && dividiData) { ult.ehCompl = true; nCompl++; }
  });

  // 3) SUBSTITUI os meses presentes no arquivo (não acumula).
  //    Antes o sistema só evitava repetir pelo "Num. Interno" — que vem em branco
  //    neste relatório. Resultado: subir o mesmo mês duas vezes dobrava tudo.
  const antes = FINdados.coletas.length;
  FINdados.coletas = FINdados.coletas.filter(c=>!mesesNoArquivo.has(c.ym));
  const removidas = antes - FINdados.coletas.length;
  // as linhas de complemento de mínima NÃO são guardadas: elas são acerto de cobrança,
  // não coleta. O faturado continua certo porque guardamos a mínima em cada linha
  // (faturado = maior entre o coletado e a mínima). Guardar menos linha = envio mais rápido.
  novas.filter(c=>!c.ehCompl).forEach(c=>{ delete c.ehCompl; delete c.ordem; FINdados.coletas.push(c); });

  st._mesesEnviar = [...mesesNoArquivo].sort();   // só estes meses vão pro servidor
  const meses = [...mesesNoArquivo].sort().map(m=>finRotMes(m)).join(', ');
  const dias = [...new Set(novas.map(c=>c.data))].sort();
  const nClientes = new Set(novas.map(c=>c.cnpj)).size;
  const primeiro = dias[0]||'', ultimo = dias[dias.length-1]||'';
  const fmtD = d => d ? d.split('-').reverse().join('/') : '';
  // de propósito não somamos as quantidades aqui: saco, contêiner e quilo não se somam
  st.innerHTML = `${novas.length} linhas de ${meses} · ${nClientes} clientes · ${fmtD(primeiro)} a ${fmtD(ultimo)}`
    + (nCompl?` · ${nCompl} complemento(s) de mínima identificado(s)`:'')
    + (removidas?` · substituiu ${removidas} linha(s) do mesmo mês`:'')
    + `<div style="font-size:11px;color:var(--cinza-500);margin-top:3px;"><i class="ti ti-info-circle"></i> Confira o período: se o mês não veio inteiro, os números ficam menores que o real.</div>`;
  st.style.color='var(--verde-medio)';
}

// número da semana dentro do mês por BLOCOS FIXOS DE DIAS (opção A):
// dias 1-7 = sem1, 8-14 = sem2, 15-21 = sem3, 22-28 = sem4, 29+ = sem5.
// Blocos iguais em todo mês -> alinham entre meses (dia 1-7 de maio vs dia 1-7 de junho).
function FIN_semanaDoMes(dt){
  return Math.min(5, Math.floor((dt.getDate()-1)/7) + 1);
}
// rótulo amigável da semana (mostra os dias do bloco)
function FIN_rotSemana(s){
  const faixas={1:'dias 1–7',2:'dias 8–14',3:'dias 15–21',4:'dias 22–28',5:'dia 29+'};
  return `Semana ${s} (${faixas[s]||''})`;
}

// ============ SAÚDE FINANCEIRA ============
function finYmDeData(s){
  const t=finLc(s);
  // formato BR: dd/mm/aaaa (ou dd/mm/aa)
  let m=t.match(/(\d{2})\/(\d{2})\/(\d{2,4})/);
  if(m){ let ano=m[3].length===2?'20'+m[3]:m[3]; return `${ano}-${m[2]}`; }
  // formato ISO: aaaa-mm-dd (como às vezes volta do Sheets)
  m=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m){ return `${m[1]}-${m[2]}`; }
  return '';
}

function FIN_renderSaude(){
  const p=document.getElementById('p-saude');
  if(!FINdados.pagar.length && !FINdados.receber.length){ p.innerHTML='<div class="card"><div class="vazio">Suba os relatórios de Pagar e Receber primeiro.</div></div>'; return; }
  const baseData = (window._saudeBase||'emissao');
