  // se não houver, cai no parse da data de emissão.
  FINdados.receber.filter(r=>!String(r.situacao||'').toLowerCase().includes('cancel')).forEach(r=>{
    const ym = baseData==='competencia' ? finCompYM(r.competencia) : (r._mesEmissao || finYmDeData(r.emissao));
    // receita pelo LÍQUIDO (o que de fato entra, já sem impostos). Se o título não tiver líquido, cai no bruto.
    const valLiq = (r.liquido!=null && r.liquido!=='' && r.liquido!==0) ? r.liquido : r.valor;
    if(ym){ receita[ym]=(receita[ym]||0)+valLiq; receitaBruta[ym]=(receitaBruta[ym]||0)+(r.valor||0); }
  });
  // despesa = contas a pagar, por _mesPagamento (pré-calculado) ou parse da data de pagamento
  FINdados.pagar.filter(r=>!String(r.situacao||'').toLowerCase().includes('cancel')).forEach(r=>{
    const ym = baseData==='competencia' ? finCompYM(r.competencia) : (r._mesPagamento || finYmDeData(r.pagamento));
    if(ym){ despesa[ym]=(despesa[ym]||0)+r.valor; }
  });
  // normaliza qualquer chave de mês pro formato aaaa-mm (evita "2026-5" vs "2026-05" virarem 2 linhas)
  const norYm = k => { const m=String(k).match(/(\d{4})-(\d{1,2})/); return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}` : k; };
  const consolida = obj => { const out={}; Object.entries(obj).forEach(([k,v])=>{ const nk=norYm(k); out[nk]=(out[nk]||0)+v; }); return out; };
  // consolida os dados dos relatórios PRIMEIRO (chaves normalizadas)
  const receitaR = consolida(receita), receitaBrutaR = consolida(receitaBruta), despesaR = consolida(despesa);
  Object.keys(receita).forEach(k=>delete receita[k]); Object.assign(receita, receitaR);
  Object.keys(receitaBruta).forEach(k=>delete receitaBruta[k]); Object.assign(receitaBruta, receitaBrutaR);
  Object.keys(despesa).forEach(k=>delete despesa[k]); Object.assign(despesa, despesaR);
  // meses que têm relatório subido (receber e pagar, separadamente — já normalizados)
  const mesesComRelatorio = new Set(Object.keys(receita));
  const mesesComDespesa = new Set(Object.keys(despesa));
  // adiciona os valores históricos fixos SÓ onde não há relatório daquele mês (relatório manda)
  Object.entries(FIN_RECEITA_HISTORICA).forEach(([ym, v])=>{
    if (!mesesComRelatorio.has(ym)) {
      receita[ym] = v.liquido;         // receita líquida (padrão da tela)
      receitaBruta[ym] = v.bruto;      // bruto
    }
    // despesa histórica (só 2025 tem): aplica se o mês não tiver relatório de pagar subido
    if (v.despesa!=null && !mesesComDespesa.has(ym)) {
      despesa[ym] = v.despesa;
    }
  });
  const meses=[...new Set([...Object.keys(receita),...Object.keys(despesa)])].filter(Boolean).sort();
  const mesSel = window._saudeMes || 'todos';
  const mesesMostrar = mesSel==='todos' ? meses : meses.filter(m=>m===mesSel);
  let totR=0,totD=0,totBruto=0;
  let linhas=mesesMostrar.map(m=>{ const rv=receita[m]||0, dv=despesa[m]||0, res=rv-dv; totR+=rv; totD+=dv; totBruto+=(receitaBruta[m]||0);
    // variação da receita vs o mês imediatamente anterior (na sequência completa de meses)
    const idxM = meses.indexOf(m);
    const mAnt = idxM>0 ? meses[idxM-1] : null;
    const rvAnt = mAnt ? (receita[mAnt]||0) : null;
    let varHtml = '<span style="color:var(--cinza-400);">—</span>';
    if (rvAnt!=null && rvAnt>0) {
      const pct = (rv-rvAnt)/rvAnt*100;
      const cor = pct>=0 ? 'var(--verde-medio)' : 'var(--vermelho)';
      const seta = pct>=0 ? '▲' : '▼';
      varHtml = `<span style="color:${cor};font-weight:600;">${seta} ${Math.abs(pct).toFixed(1)}%</span>`;
    }
    return `<tr><td>${finRotMes(m)}</td><td>${finFmtM(rv)}</td><td>${varHtml}</td><td>${finFmtM(dv)}</td><td class="${res>=0?'pos':'neg'}">${finFmtM(res)}</td><td class="${res>=0?'pos':'neg'}">${rv?(res/rv*100).toFixed(1):'0'}%</td></tr>`;
  }).join('');
  const totRes=totR-totD;
  const maiorCentro=(()=>{ const c={}; FINdados.pagar.forEach(x=>c[x.centro]=(c[x.centro]||0)+x.valor); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; })();
  p.innerHTML=`
    <div class="filtros">
      <span style="font-size:13px;color:var(--cinza-600);">Mês:</span>
      <select onchange="window._saudeMes=this.value;FIN_renderSaude()">
        <option value="todos" ${mesSel==='todos'?'selected':''}>Todos (evolução)</option>
        ${meses.map(m=>`<option value="${m}" ${m===mesSel?'selected':''}>${finRotMes(m)}</option>`).join('')}
      </select>
      <span style="font-size:13px;color:var(--cinza-600);">Base:</span>
      <select onchange="window._saudeBase=this.value;FIN_renderSaude()">
        <option value="emissao" ${baseData==='emissao'?'selected':''}>Emissão/Pagamento (bate com os relatórios)</option>
        <option value="competencia" ${baseData==='competencia'?'selected':''}>Competência (mês do serviço)</option>
      </select>
      <button class="btn sec" onclick="window.print()" style="margin-left:auto;"><i class="ti ti-printer"></i> Exportar / Imprimir</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="num">${finFmtM(totBruto)}</div><div class="lbl">Receita bruta</div></div>
      <div class="kpi" style="border-top-color:var(--verde-medio);"><div class="num" style="color:var(--verde-escuro);">${finFmtM(totR)}</div><div class="lbl">Receita líquida (sem impostos)</div></div>
      <div class="kpi verm"><div class="num">${finFmtM(totD)}</div><div class="lbl">Despesa total</div></div>
      <div class="kpi ${totRes>=0?'':'verm'}"><div class="num">${finFmtM(totRes)}</div><div class="lbl">Resultado (sobre o líquido)</div></div>
      <div class="kpi"><div class="num">${totR?(totRes/totR*100).toFixed(1):'0'}%</div><div class="lbl">Margem (sobre o líquido)</div></div>
    </div>
    <div class="card">
      <h2>Receita vs Despesa por mês</h2>
      <table><thead><tr><th>Mês</th><th>Receita</th><th>vs mês anterior</th><th>Despesa</th><th>Resultado</th><th>Margem</th></tr></thead>
      <tbody>${linhas||'<tr><td colspan="6" class="vazio">Sem dados no período.</td></tr>'}</tbody></table>
      <div style="font-size:11px;color:var(--cinza-500);margin-top:8px;"><i class="ti ti-info-circle"></i> Todo o ano de 2025 e Janeiro a Abril/2026: dados de registro histórico. Maio/2026 em diante vem dos relatórios subidos (que têm prioridade). Em 2025 a despesa também é histórica; em 2026 a despesa vem dos relatórios de Contas a Pagar.</div>
    </div>
    <div class="card">
      <h2>Leitura automática</h2>
      <p style="font-size:14px;line-height:1.7;color:var(--cinza-700);">
        No período carregado, a receita <b>líquida</b> (já sem impostos) somou <b>${finFmtM(totR)}</b> e a despesa <b>${finFmtM(totD)}</b>,
        resultando em <b class="${totRes>=0?'pos':'neg'}">${totRes>=0?'superávit':'déficit'} de ${finFmtM(Math.abs(totRes))}</b>
        (margem de ${totR?(totRes/totR*100).toFixed(1):'0'}%).
        ${maiorCentro?`O centro de custo de maior peso foi <b>${maiorCentro[0]}</b> (${finFmtM(maiorCentro[1])}).`:''}
      </p>
    </div>`;
}

// ============ CONTAS A PAGAR ============
function FIN_renderPagar(){
  const p=document.getElementById('p-pagar');
  if(!FINdados.pagar.length){ p.innerHTML='<div class="card"><div class="vazio">Suba o relatório de Contas a Pagar.</div></div>'; return; }
  // exclui cancelados
  const base = FINdados.pagar.filter(x=>!String(x.situacao||'').toLowerCase().includes('cancel'));
  // meses disponíveis (por data de pagamento)
  const meses=[...new Set(base.map(x=>finMesPag(x)).filter(Boolean))].sort();
  const mesSel = window._pagMes || 'todos';
  const centroSel = window._pagCentro || 'todos';
  // lista de centros (pra o filtro)
  const centrosLista=[...new Set(base.map(x=>x.centro))].sort();
  // aplica filtros
  let lista = base.slice();
  if(mesSel!=='todos') lista = lista.filter(x=>finMesPag(x)===mesSel);
  if(centroSel!=='todos') lista = lista.filter(x=>x.centro===centroSel);
  // total por centro (da lista filtrada)
  const porCentro={}; lista.forEach(x=>porCentro[x.centro]=(porCentro[x.centro]||0)+x.valor);
  const centros=Object.entries(porCentro).sort((a,b)=>b[1]-a[1]);
  const totalP=centros.reduce((s,c)=>s+c[1],0);
  // análise mensal por centro (usa a base toda, por pagamento)
  const mesesAll=[...new Set(base.map(x=>finMesPag(x)).filter(Boolean))].sort();
  let analise='';
  if(mesesAll.length>=2){
    const piv={}; base.forEach(x=>{ const ym=finMesPag(x); if(!ym)return; if(centroSel!=='todos'&&x.centro!==centroSel)return; piv[x.centro]=piv[x.centro]||{}; piv[x.centro][ym]=(piv[x.centro][ym]||0)+x.valor; });
    let head='<tr><th>Centro de custo</th>'+mesesAll.map(m=>`<th>${finRotMes(m)}</th><th>Δ%</th>`).join('')+'</tr>';
    let body=Object.entries(piv).sort((a,b)=>{const sa=Object.values(a[1]).reduce((x,y)=>x+y,0);const sb=Object.values(b[1]).reduce((x,y)=>x+y,0);return sb-sa;}).map(([c,mv])=>{
      let ant=null; let tds=mesesAll.map(m=>{ const v=mv[m]||0; let d=''; if(ant!=null&&ant!==0) d=((v-ant)/ant*100); ant=v; return `<td>${v?finFmtM(v):'—'}</td><td class="${d===''?'':(d>=0?'neg':'pos')}">${d===''?'—':(d>=0?'+':'')+d.toFixed(0)+'%'}</td>`; }).join('');
      return `<tr><td><b>${c}</b></td>${tds}</tr>`;
    }).join('');
    analise=`<div class="card"><h2>Análise mensal por centro de custo</h2><div style="overflow-x:auto;"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
      <p style="font-size:12px;color:var(--cinza-500);margin-top:8px;">Δ% = variação vs o mês anterior. Verde = caiu, vermelho = subiu.</p></div>`;
  }
  // ===== Evolução ao longo dos meses de um CENTRO ou DESPESA específico =====
  const despesasLista=[...new Set(base.map(x=>x.despesa).filter(Boolean))].sort();
  const evoTipo = window._pagEvoTipo || 'centro'; // 'centro' ou 'despesa'
  const evoItem = window._pagEvoItem || (evoTipo==='centro' ? (centrosLista[0]||'') : (despesasLista[0]||''));
  const evoPorMes={};
  base.forEach(x=>{ const ym=finMesPag(x); if(!ym) return; const chave = evoTipo==='centro'?x.centro:x.despesa; if(chave===evoItem) evoPorMes[ym]=(evoPorMes[ym]||0)+x.valor; });
  const evoMeses=mesesAll;
  const evoValores=evoMeses.map(m=>evoPorMes[m]||0);
  const evoMax=Math.max(1,...evoValores);
  const evoTotal=evoValores.reduce((s,v)=>s+v,0);
  const gW=Math.max(320, evoMeses.length*70), gH=200, pad=30, bw=40;
  const barras=evoMeses.map((m,i)=>{
    const x=pad+i*((gW-pad*2)/Math.max(1,evoMeses.length));
    const h=(evoValores[i]/evoMax)*(gH-pad-20);
    const y=gH-pad-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--verde-medio)"></rect>
      <text x="${x+bw/2}" y="${gH-pad+14}" font-size="10" text-anchor="middle" fill="var(--cinza-600)">${finRotMes(m).slice(0,3)}</text>
      <text x="${x+bw/2}" y="${y-4}" font-size="9" text-anchor="middle" fill="var(--cinza-700)">${evoValores[i]?finFmtM(evoValores[i]).replace('R$ ','').replace(',00',''):''}</text>`;
  }).join('');
  const evoGrafico = evoMeses.length ? `<svg viewBox="0 0 ${gW} ${gH}" style="width:100%;max-width:${gW}px;height:auto;"><line x1="${pad}" y1="${gH-pad}" x2="${gW-pad}" y2="${gH-pad}" stroke="var(--cinza-200)"></line>${barras}</svg>` : '<div class="vazio">Sem dados.</div>';
  let evoAnt=null;
  const evoLinhas=evoMeses.map(m=>{ const v=evoPorMes[m]||0; let d=''; if(evoAnt!=null&&evoAnt!==0) d=((v-evoAnt)/evoAnt*100); evoAnt=v;
    return `<tr><td>${finRotMes(m)}</td><td>${v?finFmtM(v):'—'}</td><td class="${d===''?'':(d>=0?'neg':'pos')}">${d===''?'—':(d>=0?'+':'')+d.toFixed(0)+'%'}</td></tr>`; }).join('');
  const evolucao=`<div class="card">
    <h2>Evolução ao longo dos meses</h2>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <select onchange="window._pagEvoTipo=this.value;window._pagEvoItem='';FIN_renderPagar()" style="padding:6px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:13px;">
        <option value="centro" ${evoTipo==='centro'?'selected':''}>Centro de custo</option>
        <option value="despesa" ${evoTipo==='despesa'?'selected':''}>Despesa</option>
      </select>
      <select onchange="window._pagEvoItem=this.value;FIN_renderPagar()" style="padding:6px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:13px;min-width:220px;">
        ${(evoTipo==='centro'?centrosLista:despesasLista).map(it=>`<option value="${String(it).replace(/"/g,'')}" ${it===evoItem?'selected':''}>${it}</option>`).join('')}
      </select>
      <span style="font-size:13px;color:var(--cinza-600);margin-left:auto;">Total no período: <b>${finFmtM(evoTotal)}</b></span>
    </div>
    <div style="overflow-x:auto;margin-bottom:12px;">${evoGrafico}</div>
    <table><thead><tr><th>Mês</th><th>Valor</th><th>Δ% vs anterior</th></tr></thead><tbody>${evoLinhas||'<tr><td colspan="3" class="vazio">Sem dados.</td></tr>'}</tbody></table>
    <p style="font-size:12px;color:var(--cinza-500);margin-top:8px;">Δ% = variação vs o mês anterior. Verde = caiu, vermelho = subiu.</p>
  </div>`;
  p.innerHTML=`
    <div class="filtros">
      <span style="font-size:13px;color:var(--cinza-600);">Mês (pagamento):</span>
      <select onchange="window._pagMes=this.value;FIN_renderPagar()">
        <option value="todos" ${mesSel==='todos'?'selected':''}>Todos</option>
        ${meses.map(m=>`<option value="${m}" ${m===mesSel?'selected':''}>${finRotMes(m)}</option>`).join('')}
      </select>
      <span style="font-size:13px;color:var(--cinza-600);">Centro de custo:</span>
      <select onchange="window._pagCentro=this.value;FIN_renderPagar()">
        <option value="todos" ${centroSel==='todos'?'selected':''}>Todos</option>
        ${centrosLista.map(c=>`<option value="${c.replace(/"/g,'')}" ${c===centroSel?'selected':''}>${c}</option>`).join('')}
      </select>
      <button class="btn sec" onclick="window.print()" style="margin-left:auto;"><i class="ti ti-printer"></i> Exportar / Imprimir</button>
    </div>
    <div class="kpis">
      <div class="kpi verm"><div class="num">${finFmtM(totalP)}</div><div class="lbl">Total a pagar${mesSel!=='todos'?' · '+finRotMes(mesSel):''}${centroSel!=='todos'?' · '+centroSel:''}</div></div>
      <div class="kpi"><div class="num">${lista.length}</div><div class="lbl">títulos</div></div>
    </div>
    <div class="card">
      <h2>Despesa por centro de custo</h2>
      <p style="font-size:12px;color:var(--cinza-500);margin-bottom:8px;"><i class="ti ti-info-circle"></i> Clique num centro de custo para ver as despesas dentro dele.</p>
      <table><thead><tr><th>Centro de custo</th><th>Total</th><th>% do total</th></tr></thead><tbody>
      ${centros.map(([c,v],idx)=>{
        // despesas dentro deste centro (da lista filtrada)
        const desp={}; lista.filter(x=>x.centro===c).forEach(x=>{ const d=x.despesa||'(sem despesa)'; desp[d]=(desp[d]||0)+x.valor; });
        const despOrd=Object.entries(desp).sort((a,b)=>b[1]-a[1]);
        const detId='pag-desp-'+idx;
        const detalhe=despOrd.map(([d,dv])=>`<tr style="background:var(--cinza-50);font-size:12px;"><td style="padding:5px 0 5px 24px;">${d}</td><td>${finFmtM(dv)}</td><td style="color:var(--cinza-500);">${v?(dv/v*100).toFixed(1):'0'}% do centro</td></tr>`).join('');
        return `<tr style="cursor:pointer;" onclick="var e=document.getElementById('${detId}');e.style.display=e.style.display==='table-row-group'?'none':'table-row-group';">
            <td><i class="ti ti-chevron-right" style="font-size:12px;"></i> ${c}</td><td>${finFmtM(v)}</td>
            <td>${totalP?(v/totalP*100).toFixed(1):'0'}%<div class="barra"><div style="width:${totalP?(v/totalP*100).toFixed(1):0}%"></div></div></td></tr>
          <tbody id="${detId}" style="display:none;">${detalhe||'<tr><td colspan="3" style="padding-left:24px;color:var(--cinza-500);font-size:12px;">Sem detalhe de despesa.</td></tr>'}</tbody>`;
      }).join('')}
      <tr style="background:var(--cinza-100);"><td><b>TOTAL</b></td><td><b>${finFmtM(totalP)}</b></td><td></td></tr>
      </tbody></table>
    </div>
    ${analise}
    ${evolucao}`;
}

// ============ CONTAS A RECEBER ============
function FIN_renderReceber(){
  const p=document.getElementById('p-receber');
  const temEmit = FINdados.receber.length, temReceb = FINdados.recebeReceb.length;
  if(!temEmit && !temReceb){ p.innerHTML='<div class="card"><div class="vazio">Suba os relatórios de Contas a Receber (Emitidos e/ou Recebidos).</div></div>'; return; }
  // DIAGNÓSTICO: detecta impostos corrompidos (imposto maior que o valor bruto do título é impossível)
  const corrompidos = FINdados.receber.filter(x=>{
    const b = x.valor||0; if(b<=0) return false;
    return [x.iss,x.inss,x.pis,x.cofins,x.csll,x.ir].some(v=>(v||0) > b);
  });
  window._finImpostoDiag = corrompidos.length ? { total: corrompidos.length, exemplo: corrompidos[0] } : null;
  const semCancel = x=>!String(x.situacao||'').toLowerCase().includes('cancel');
  // mês de emissão robusto: usa o campo pré-calculado (sobrevive ao Sheets); senão parseia a data
  const mesEmiss = x => x._mesEmissao || finYmDeData(x.emissao);
  // EMITIDOS: base por emissão
  const baseEmit = FINdados.receber.filter(semCancel);
  // RECEBIDOS: base do relatório de recebidos
  const baseReceb = FINdados.recebeReceb.filter(semCancel);
  // meses disponíveis (emissão dos emitidos)
  const meses=[...new Set(baseEmit.map(mesEmiss).filter(Boolean))].sort();
  const mesSel = window._recMes || 'todos';
  // filtra emitidos por emissão
  const listaEmit = mesSel==='todos' ? baseEmit : baseEmit.filter(x=>mesEmiss(x)===mesSel);
  const emitido = listaEmit.reduce((s,x)=>s+x.valor,0);
  const aberto = listaEmit.reduce((s,x)=>s+x.saldo,0);
  // SANEAMENTO: imposto maior que o próprio valor do título é impossível (dado corrompido de upload antigo).
  // Nesses casos o imposto é ignorado (0), pra não inflar o total (era o que causava ISS de milhões / 1000%).
  const imp = (x, campo) => { const v=x[campo]||0; const b=x.valor||0; return (b>0 && v>b) ? 0 : v; };
  const impostosDoTitulo = x => imp(x,'iss')+imp(x,'inss')+imp(x,'pis')+imp(x,'cofins')+imp(x,'csll')+imp(x,'ir');
  // impostos e líquido (dos emitidos do período)
  const tISS = listaEmit.reduce((s,x)=>s+imp(x,'iss'),0);
  const tINSS = listaEmit.reduce((s,x)=>s+imp(x,'inss'),0);
  const tPIS = listaEmit.reduce((s,x)=>s+imp(x,'pis'),0);
  const tCOFINS = listaEmit.reduce((s,x)=>s+imp(x,'cofins'),0);
  const tCSLL = listaEmit.reduce((s,x)=>s+imp(x,'csll'),0);
  const tIR = listaEmit.reduce((s,x)=>s+imp(x,'ir'),0);
  const totalImpostos = tISS+tINSS+tPIS+tCOFINS+tCSLL+tIR;
  // líquido: usa a coluna "Vlr. Líquido" da planilha (se for coerente, <= bruto); senão bruto - impostos saneados.
  const liquido = listaEmit.reduce((s,x)=>{
    const b=x.valor||0, l=x.liquido||0;
    const ok = l>0 && (b<=0 || l<=b*1.0001);
    return s + (ok ? l : (b - impostosDoTitulo(x) - (x.desconto||0)));
  },0);
  // recebido: filtra também pelo mês selecionado (por emissão do recebido)
  const listaReceb = mesSel==='todos' ? baseReceb : baseReceb.filter(x=>mesEmiss(x)===mesSel);
  const recebidoTotal = listaReceb.reduce((s,x)=>s+(x.recebido||x.valor),0);
  const porSit={}; listaEmit.forEach(x=>porSit[x.situacao||'—']=(porSit[x.situacao||'—']||0)+x.valor);

// ============ TAXA FISLURB (anual) ============
// Lista clientes que pagam a taxa (origem: aba Reajustes FISLURB=Sim + os já salvos).
// Valor + pago + data, editáveis por ANO (uma linha por cliente; histórico por ano guardado em JSON).
function _fisNorm(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
async function FIN_renderFislurb(){
  const p=document.getElementById('p-fislurb');
  p.innerHTML='<div class="card"><div class="vazio">Carregando taxa FISLURB...</div></div>';
  // quem paga: aba Reajustes (FISLURB=Sim), deduplicado por cliente
  const rr=await buscarDados('Reajustes');
  const reaj = (typeof dedupReajustes==='function') ? dedupReajustes(rr.ok?rr.linhas:[]) : (rr.ok?rr.linhas:[]);
  const pagam={};
  reaj.forEach(r=>{ if(String(r['FISLURB']||'').trim().toLowerCase()==='sim'){ const n=_fisNorm(r['CLIENTE']); if(n && !pagam[n]) pagam[n]={cliente:r['CLIENTE'],cnpj:r['CNPJ']||''}; } });
  // valores já salvos
  const rt=await buscarDados('Taxa_Fislurb');
  const salvos={};
  (rt.ok?rt.linhas:[]).forEach(l=>{ const n=_fisNorm(l['CLIENTE']); let v={}; try{v=JSON.parse(l['VALORES_JSON']||'{}');}catch(e){} salvos[n]={valores:v}; if(!pagam[n]) pagam[n]={cliente:l['CLIENTE'],cnpj:l['CNPJ']||''}; });
  const anoAtual=new Date().getFullYear();
  const ano=window._fisAno||String(anoAtual);
  const anosSet=new Set([String(anoAtual),String(anoAtual-1)]);
  Object.values(salvos).forEach(s=>Object.keys(s.valores||{}).forEach(a=>anosSet.add(a)));
  const anos=[...anosSet].sort().reverse();
  const busca=(window._fisBusca||'').toLowerCase();
  let lista=Object.values(pagam);
  if(busca) lista=lista.filter(x=>String(x.cliente||'').toLowerCase().includes(busca));
  lista.sort((a,b)=>String(a.cliente).localeCompare(String(b.cliente)));
  // KPIs do ano
  let totValor=0,nPagos=0,nPend=0;
  lista.forEach(x=>{ const e=(salvos[_fisNorm(x.cliente)]||{}).valores; const it=e?e[ano]:null; const val=it?(parseMoedaReaj(it.valor)||0):0; totValor+=val; if(it&&String(it.pago).toLowerCase()==='sim')nPagos++; else nPend++; });
  const rows=lista.map((x,i)=>{
    const e=((salvos[_fisNorm(x.cliente)]||{}).valores||{})[ano]||{};
    const pagoSim=String(e.pago||'').toLowerCase()==='sim';
    const cliJs=String(x.cliente).replace(/'/g,"\\'");
    const cnpjJs=String(x.cnpj||'').replace(/'/g,"\\'");
    return `<tr>
      <td><b>${x.cliente}</b>${x.cnpj?`<div style="font-size:11px;color:var(--cinza-500);">${x.cnpj}</div>`:''}</td>
      <td><span style="font-size:12px;color:var(--cinza-500);">R$</span> <input type="number" step="0.01" id="fis-val-${i}" value="${e.valor!=null?e.valor:''}" placeholder="0,00" style="width:110px;padding:6px;border:1.5px solid var(--cinza-300);border-radius:7px;"></td>
      <td><select id="fis-pago-${i}" style="padding:6px;border:1.5px solid var(--cinza-300);border-radius:7px;"><option value="Não" ${!pagoSim?'selected':''}>Não pago</option><option value="Sim" ${pagoSim?'selected':''}>Pago</option></select></td>
      <td><input type="date" id="fis-data-${i}" value="${e.data||''}" style="padding:6px;border:1.5px solid var(--cinza-300);border-radius:7px;"></td>
      <td><button id="fis-btn-${i}" class="btn sec" onclick="salvarFislurbFront(${i},'${cliJs}','${cnpjJs}')"><i class="ti ti-device-floppy"></i> Salvar</button></td>
    </tr>`;
  });
  p.innerHTML=`
    <div class="filtros" style="flex-wrap:wrap;">
      <span style="font-size:13px;color:var(--cinza-600);">Ano:</span>
      <select onchange="window._fisAno=this.value;FIN_renderFislurb()">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
      <input type="text" placeholder="Buscar cliente..." value="${(window._fisBusca||'').replace(/"/g,'&quot;')}" oninput="window._fisBusca=this.value;FIN_renderFislurb()" style="padding:7px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:13px;min-width:180px;">
      <button class="btn sec" onclick="window.print()" style="margin-left:auto;"><i class="ti ti-printer"></i> Exportar / Imprimir</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="num">${lista.length}</div><div class="lbl">Clientes que pagam FISLURB</div></div>
      <div class="kpi" style="border-top-color:var(--verde-medio);"><div class="num" style="color:var(--verde-escuro);">${nPagos}</div><div class="lbl">Pagaram em ${ano}</div></div>
      <div class="kpi verm"><div class="num">${nPend}</div><div class="lbl">Pendentes em ${ano}</div></div>
      <div class="kpi"><div class="num">${finFmtM(totValor)}</div><div class="lbl">Total lançado em ${ano}</div></div>
    </div>
    <div class="card">
      <h2>Taxa FISLURB — ${ano}</h2>
      <p style="font-size:12px;color:var(--cinza-500);margin-bottom:8px;">Anual. Preencha o valor, marque se já foi pago e a data. Cada ano fica salvo separadamente (troque no seletor de ano). Clientes vêm de quem tem FISLURB = Sim na aba Reajustes.</p>
      <table><thead><tr><th>Cliente</th><th>Valor pago</th><th>Situação</th><th>Data</th><th></th></tr></thead>
      <tbody>${rows.join('')||'<tr><td colspan="5" class="vazio">Nenhum cliente paga FISLURB (ou nenhum marcado como Sim na aba Reajustes).</td></tr>'}</tbody></table>
    </div>`;
}
async function salvarFislurbFront(i, cliente, cnpj){
  const ano=window._fisAno||String(new Date().getFullYear());
  const valor=(document.getElementById('fis-val-'+i)||{}).value||'';
  const pago=(document.getElementById('fis-pago-'+i)||{}).value||'Não';
  const data=(document.getElementById('fis-data-'+i)||{}).value||'';
  const btn=document.getElementById('fis-btn-'+i); if(btn){ btn.disabled=true; btn.innerHTML='Salvando...'; }
  try{
    const resp=await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarTaxaFislurb',token:sessaoToken,dados:{cliente,cnpj,ano,valor,pago,data}})});
    const r=await resp.json();
    if(!r.ok){ alert('Erro: '+(r.erro||'republique o Apps Script.')); if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Salvar';} return; }
    if(btn){ btn.innerHTML='<i class="ti ti-check"></i> Salvo'; }
    setTimeout(()=>FIN_renderFislurb(), 600);
  }catch(e){ alert('Erro de conexão.'); if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Salvar';} }
}

// ============================================================
// GRUPOS EMPRESARIAIS (para filtrar a aba Coletas)
// Um grupo é definido pela RAIZ do CNPJ (os 8 primeiros dígitos). Assim,
// qualquer unidade nova da rede entra sozinha no filtro, sem precisar cadastrar
// uma a uma — e sem depender de como o nome veio escrito no relatório.
// Para incluir outra rede, é só acrescentar aqui a raiz do CNPJ dela.
// ============================================================
const GRUPOS_EMPRESA = {
  'DASA': {
    raizes: ['61486650',   // Delboni Auriemo / Lavoisier / Alta Excelência (DA-, LV-, AE-)
             '04539279',   // Cientifica Lâmina (ADM-CL, ARMAZEM-CL)
             '45796554'],  // Salomão Zoppi (SZ-)
    obs: 'Delboni, Lavoisier, Alta Excelência, Cientifica Lâmina e Salomão Zoppi'
  }
};
function _raizCnpj(cnpj){ return String(cnpj||'').replace(/\D/g,'').slice(0,8); }
// nome do grupo empresarial de uma coleta ('' se não pertence a nenhum)
function FIN_grupoEmpresaDe(c){
  const raiz=_raizCnpj(c && c.cnpj);
  if(!raiz) return '';
  for(const nome in GRUPOS_EMPRESA){
    if(GRUPOS_EMPRESA[nome].raizes.indexOf(raiz)>=0) return nome;
  }
  return '';
}
// predicado do filtro escolhido na tela (grupo empresarial ou grupo da aba Clientes)
function FIN_filtroGrupo(){
  const sel = window._coletaGrupoEmp || '';
  if(!sel) return ()=>true;
  if(sel.indexOf('EMP::')===0){ const nome=sel.slice(5); return c=>FIN_grupoEmpresaDe(c)===nome; }
  if(sel.indexOf('CLI::')===0){ const g=sel.slice(5).toUpperCase(); return c=>String(FIN_grupoDoCliente(c.cnpj,c.cliente)||'').toUpperCase()===g; }
  return ()=>true;
}
function FIN_grupoSelecionadoNome(){
  const sel = window._coletaGrupoEmp || '';
  if(sel.indexOf('EMP::')===0) return sel.slice(5);
  if(sel.indexOf('CLI::')===0) return sel.slice(5);
  return '';
}
// opções do seletor: grupos empresariais (por CNPJ) + grupos cadastrados na aba Clientes
function FIN_opcoesGrupo(){
  const sel = window._coletaGrupoEmp || '';
  let h = `<option value="" ${sel===''?'selected':''}>Todos os clientes</option>`;
  Object.keys(GRUPOS_EMPRESA).forEach(nome=>{
    const n=new Set((FINdados.coletas||[]).filter(c=>FIN_grupoEmpresaDe(c)===nome).map(c=>c.cnpj)).size;
    if(n) h += `<option value="EMP::${nome}" ${sel==='EMP::'+nome?'selected':''}>${nome} (${n} unidades)</option>`;
  });
  const gs=[...new Set((cacheClientes||[]).map(c=>String(c['GRUPO']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  gs.forEach(g=>{ h += `<option value="CLI::${String(g).replace(/"/g,'')}" ${sel==='CLI::'+g?'selected':''}>${g} (grupo cadastrado)</option>`; });
  return h;
}
// ============================================================
// Painel do grupo: quebra por RESÍDUO e por UNIDADE.
// Por resíduo mostramos só o COLETADO — de propósito. A mínima do contrato é
// negociada por equipamento/unidade, não por tipo de resíduo, então ratear
// faturamento por resíduo seria inventar número.
// ============================================================
function FIN_painelGrupo(mesA, mesB, rotYM){
  const nome=FIN_grupoSelecionadoNome();
  if(!nome) return '';
  const filtro=FIN_filtroGrupo();
  const doMes=(m)=> (FINdados.coletas||[]).filter(c=>c.ym===m && filtro(c));
  const lA=doMes(mesA), lB=doMes(mesB);
  if(!lA.length && !lB.length) return `<div class="card"><div class="vazio">Nenhuma coleta de ${nome} nos meses escolhidos.</div></div>`;
  // --- por resíduo ---
  const res={};
  const somaRes=(lista,campo)=>lista.forEach(c=>{
    const k=(c.classe||'—')+' · '+(c.residuo||'—');
    (res[k]=res[k]||{a:0,b:0,linA:0,linB:0})[campo]+= (c.ehCompl?0:(c.qtdeServ||0));
    res[k][campo==='a'?'linA':'linB']++;
  });
  somaRes(lA,'a'); somaRes(lB,'b');
  const linhasRes=Object.entries(res).sort((x,y)=>y[1].b-x[1].b).map(([k,v])=>{
    const varP = v.a>0 ? ((v.b-v.a)/v.a*100) : null;
    const cor = varP===null?'':(varP>0.5?'pos':varP<-0.5?'neg':'');
    const vt = varP===null?'—':(varP>0?'+':'')+varP.toFixed(0)+'%';
    return `<tr><td><b>${k}</b></td><td>${Math.round(v.a)}</td><td>${Math.round(v.b)}</td><td class="${cor}">${vt}</td></tr>`;
  }).join('');
  // --- por unidade ---
  const gA=FIN_agrupaColetas(c=>c.ym===mesA && filtro(c));
  const gB=FIN_agrupaColetas(c=>c.ym===mesB && filtro(c));
  const porUni={};
  const junta=(g,campo)=>Object.values(g).forEach(o=>{
    const u=porUni[o.cliente]||(porUni[o.cliente]={cliente:o.cliente,colA:0,colB:0,fatA:0,fatB:0});
    u['col'+campo]+=o.coletado; u['fat'+campo]+=o.faturado;
  });
  junta(gA,'A'); junta(gB,'B');
  const unis=Object.values(porUni).sort((x,y)=>y.colB-x.colB);
  const linhasUni=unis.map(u=>{
    const varP = u.colA>0 ? ((u.colB-u.colA)/u.colA*100) : null;
    const cor = varP===null?'':(varP>0.5?'pos':varP<-0.5?'neg':'');
    const vt = varP===null?(u.colB>0?'<span class="badge" style="background:var(--verde-claro-bg);color:var(--verde-escuro);">novo</span>':'—'):(u.colB===0?'<span class="neg">parou</span>':(varP>0?'+':'')+varP.toFixed(0)+'%');
    const min = u.fatB>u.colB+0.001;
    return `<tr><td><b>${u.cliente}</b></td><td>${Math.round(u.colA)}</td><td>${Math.round(u.colB)}</td>
      <td>${min?`<b style="color:var(--roxo);" title="A mínima do contrato entrou na conta">${Math.round(u.fatB)}</b> <span style="font-size:10px;color:var(--roxo);">mín.</span>`:`<span style="color:var(--cinza-500);">${Math.round(u.fatB)}</span>`}</td>
      <td class="${cor}">${vt}</td></tr>`;
  }).join('');
  const totColA=unis.reduce((s,u)=>s+u.colA,0), totColB=unis.reduce((s,u)=>s+u.colB,0);
  const totFatB=unis.reduce((s,u)=>s+u.fatB,0);
  const comMin=unis.filter(u=>u.fatB>u.colB+0.001).length;
  const varTot = totColA>0 ? ((totColB-totColA)/totColA*100) : null;
  return `
    <div class="card" style="border-left:3px solid var(--verde-escuro);">
      <h2><i class="ti ti-building-community"></i> ${nome} — visão do grupo</h2>
      ${GRUPOS_EMPRESA[nome]?`<div style="font-size:11.5px;color:var(--cinza-500);margin:-8px 0 12px;">${GRUPOS_EMPRESA[nome].obs} · agrupado pela raiz do CNPJ, então unidade nova entra sozinha.</div>`:''}
      <div class="kpis">
        <div class="kpi"><div class="num">${unis.length}</div><div class="lbl">unidades com coleta</div></div>
        <div class="kpi"><div class="num">${Math.round(totColB).toLocaleString('pt-BR')}</div><div class="lbl">coletado em ${rotYM(mesB)}</div></div>
        <div class="kpi ${varTot!=null&&varTot<0?'verm':''}"><div class="num">${varTot==null?'—':(varTot>0?'+':'')+varTot.toFixed(1)+'%'}</div><div class="lbl">vs ${rotYM(mesA)} (${Math.round(totColA).toLocaleString('pt-BR')})</div></div>
        <div class="kpi roxo"><div class="num">${Math.round(totFatB).toLocaleString('pt-BR')}</div><div class="lbl">faturado em ${rotYM(mesB)}${comMin?` · ${comMin} na mínima`:''}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Por resíduo</h2>
      <p style="font-size:12px;color:var(--cinza-500);margin-bottom:8px;">Quantidade <b>coletada</b> por classe e tipo de resíduo. Não rateio faturamento aqui: a mínima é por contrato/equipamento, não por resíduo.</p>
      <table><thead><tr><th>Classe · Resíduo</th><th>${rotYM(mesA)}</th><th>${rotYM(mesB)}</th><th>Variação</th></tr></thead>
      <tbody>${linhasRes||'<tr><td colspan="4" class="vazio">Sem dados.</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h2>Por unidade (${unis.length})</h2>
      <table><thead><tr><th>Unidade</th><th>Coletado ${rotYM(mesA)}</th><th>Coletado ${rotYM(mesB)}</th><th>Faturado ${rotYM(mesB)}</th><th>Variação</th></tr></thead>
      <tbody>${linhasUni||'<tr><td colspan="5" class="vazio">Sem dados.</td></tr>'}</tbody></table>
    </div>`;
}
// ============================================================
// Agrupamento das coletas.
// A pessoa escolhe na tela como quer ver:
//   'unidade' (padrão) — cada unidade separada, como vem no relatório.
//                        É o certo pra La Braciera, que tem 12 lojas.
//   'grupo'            — junta pelo campo GRUPO da aba Clientes.
//                        É o certo pra Gara School (3 CNPJs) e pra PUC.
// Antes o sistema decidia sozinho, removendo sufixos como "- MATRIZ" do nome —
// e acabava colando lojas diferentes que deviam ficar separadas.
// ============================================================
function FIN_grupoDoCliente(cnpj, nome){
  const alvo=String(cnpj||'').replace(/\D/g,'');
  let c=null;
  if (alvo) c=(cacheClientes||[]).find(x=>String(x['CNPJ']||'').replace(/\D/g,'')===alvo);
  if (!c && nome) { const n=FIN_finNormNomeCli(nome); c=(cacheClientes||[]).find(x=>FIN_finNormNomeCli(x['CLIENTE'])===n); }
  const g=c?String(c['GRUPO']||'').trim():'';
  return g || '';
}
function FIN_chaveCliente(c){
  if ((window._coletaAgrup||'unidade')==='grupo'){
    const g=FIN_grupoDoCliente(c.cnpj, c.cliente);
    if (g) return 'G::'+g.toUpperCase();
    return 'N::'+FIN_finNormNomeCli(c.cliente);   // sem grupo definido: fica sozinho, pelo nome
  }
  return 'U::'+String(c.cliente||'').trim().toUpperCase();
}
function FIN_rotuloCliente(c){
  if ((window._coletaAgrup||'unidade')==='grupo'){
    const g=FIN_grupoDoCliente(c.cnpj, c.cliente);
    if (g) return g + ' (grupo)';
  }
  return c.cliente;
}
// agrupa as coletas somando COLETADO (real) e FATURADO (respeitando a mínima)
function FIN_agrupaColetas(filtro){
  const g={};
  FINdados.coletas.filter(filtro).forEach(c=>{
    // A chave NÃO inclui a classe de propósito: a mínima do contrato é por equipamento,
    // e um mesmo equipamento pode aparecer com classes diferentes. Se a classe entrasse na
    // chave, a mínima seria aplicada uma vez em cada pedaço e o faturado saía dobrado.
    const chave=FIN_chaveCliente(c)+'||'+c.equip;
    if(!g[chave]) g[chave]={cliente:FIN_rotuloCliente(c),cnpj:c.cnpj,equip:c.equip,classe:'',residuo:c.residuo,
                            qtde:0,coletado:0,linhas:0,minima:0,peso:0,_porServ:{},_classes:new Set()};
    const o=g[chave];
    o.linhas++;
    if(c.classe) o._classes.add(c.classe);
    o.peso+=(c.pesoTon||0);
    if(!c.ehCompl) o.coletado+=(c.qtdeServ||0);
    // faturado precisa respeitar a mínima de cada tipo de serviço separadamente
    const ks=(c.tipoServ||c.equip||'')+'||'+(c.cnpj||'');
    const p=o._porServ[ks]||(o._porServ[ks]={soma:0,minima:0});
    p.soma+=(c.qtdeServ||0);
    if((c.minimaServ||0)>p.minima) p.minima=(c.minimaServ||0);
  });
  Object.values(g).forEach(o=>{
    o.faturado=Object.values(o._porServ).reduce((s,p)=>s+Math.max(p.soma,p.minima),0);
    o.minima=Object.values(o._porServ).reduce((s,p)=>s+p.minima,0);
    o.classe=[...o._classes].join(', ');
    o.qtde=o.coletado;                       // compatibilidade com telas antigas
    delete o._porServ; delete o._classes;
  });
  return g;
}
// normaliza o nome do cliente (acentos/pontuação) — usado só pra casar com a aba Clientes
function FIN_finNormNomeCli(s){
  return String(s||'').toUpperCase()
    .replace(/[ÁÀÂÃ]/g,'A').replace(/[ÉÊ]/g,'E').replace(/[Í]/g,'I').replace(/[ÓÔÕ]/g,'O').replace(/[Ú]/g,'U').replace(/Ç/g,'C')
    .replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}

// comparação de coletas entre 2 meses — por SEMANA (porSemana=true) ou pelo MÊS INTEIRO (porSemana=false)
// com busca por cliente e ordenação. Substitui a antiga FIN_renderColetaSemana.
function FIN_renderColetaComp(meses, rotYM, porSemana){
  const area=document.getElementById('coleta-area');
  if(meses.length<2){ area.innerHTML='<div class="card"><div class="aviso">Suba pelo menos 2 meses pra comparar (ex: junho e julho).</div></div>'; return; }
  const mesA = (window._coletaMesA && meses.includes(window._coletaMesA)) ? window._coletaMesA : meses[meses.length-2];
  const mesB = (window._coletaMesB && meses.includes(window._coletaMesB)) ? window._coletaMesB : meses[meses.length-1];
  let sem=null, semanas=[];
  if(porSemana){
    semanas=[...new Set(FINdados.coletas.filter(c=>c.ym===mesA||c.ym===mesB).map(c=>Number(c.semana)))].sort((a,b)=>a-b);
    sem = Number(window._coletaSem || semanas[0]);
  }
  // agrupa por cliente+equip+classe (mês inteiro, ou só a semana escolhida)
  const fg = FIN_filtroGrupo();   // filtro de grupo empresarial (ex: só DASA)
  const filtA = porSemana ? (c=>c.ym===mesA && Number(c.semana)===sem && fg(c)) : (c=>c.ym===mesA && fg(c));
  const filtB = porSemana ? (c=>c.ym===mesB && Number(c.semana)===sem && fg(c)) : (c=>c.ym===mesB && fg(c));
  const gA=FIN_agrupaColetas(filtA), gB=FIN_agrupaColetas(filtB);
  const chaves=[...new Set([...Object.keys(gA),...Object.keys(gB)])];
  let linhas=chaves.map(k=>{
    const a=gA[k], b=gB[k]; const base=a||b;
    const qa=a?a.coletado:0, qb=b?b.coletado:0;                 // COLETADO de verdade
    const fa=a?a.faturado:0, fb=b?b.faturado:0;                 // FATURADO (respeita a mínima)
    const varPct = qa===0 ? (qb>0?null:0) : ((qb-qa)/qa*100);
    return {cliente:base.cliente, equip:base.equip, classe:base.classe, qa, qb, fa, fb, varPct,
            minima:(b?b.minima:(a?a.minima:0)), peso_a:a?a.peso:0, peso_b:b?b.peso:0};
  });
  // busca por nome do cliente
  const busca=(window._coletaBusca||'').toLowerCase();
  if(busca) linhas=linhas.filter(l=>String(l.cliente||'').toLowerCase().includes(busca));
  // filtro de exibição
  const filtroEx = window._coletaFiltro || 'movimento';
  const nMovimento=linhas.filter(l=>l.qa>0&&l.qb>0).length, nParou=linhas.filter(l=>l.qa>0&&l.qb===0).length, nNovos=linhas.filter(l=>l.qa===0&&l.qb>0).length;
  let linhasEx = linhas;
  if(filtroEx==='movimento') linhasEx = linhas.filter(l=>l.qa>0 && l.qb>0);
  else if(filtroEx==='caiu') linhasEx = linhas.filter(l=>l.qa>0 && l.qb<l.qa);
  else if(filtroEx==='parou') linhasEx = linhas.filter(l=>l.qa>0 && l.qb===0);
  else if(filtroEx==='novos') linhasEx = linhas.filter(l=>l.qa===0 && l.qb>0);
  // ordenação
  const ordem = window._coletaOrdem || 'var-menor';
  const vp = l => (l.varPct===null ? (ordem==='var-menor'?9999:-9999) : l.varPct);
  if(ordem==='var-menor') linhasEx.sort((x,y)=>vp(x)-vp(y));       // quem mais caiu primeiro
  else if(ordem==='var-maior') linhasEx.sort((x,y)=>vp(y)-vp(x));  // quem mais subiu primeiro
  else if(ordem==='nome') linhasEx.sort((x,y)=>String(x.cliente).localeCompare(String(y.cliente)));
  else if(ordem==='volume') linhasEx.sort((x,y)=>y.qb-x.qb);       // maior volume no mês B
  const titulo = porSemana ? `${FIN_rotSemana(sem)}: ${rotYM(mesA)} vs ${rotYM(mesB)}` : `Mês inteiro: ${rotYM(mesA)} vs ${rotYM(mesB)}`;
  const painel = (!porSemana) ? FIN_painelGrupo(mesA, mesB, rotYM) : '';   // resumo da rede, quando há grupo escolhido
  area.innerHTML=`
    <div class="filtros" style="margin-bottom:10px;">
      <span style="font-size:13px;color:var(--cinza-600);">Comparar</span>
      <select onchange="window._coletaMesA=this.value;FIN_renderColetas()">${meses.map(m=>`<option value="${m}" ${m===mesA?'selected':''}>${rotYM(m)}</option>`).join('')}</select>
      <span style="font-size:13px;color:var(--cinza-600);">com</span>
      <select onchange="window._coletaMesB=this.value;FIN_renderColetas()">${meses.map(m=>`<option value="${m}" ${m===mesB?'selected':''}>${rotYM(m)}</option>`).join('')}</select>
      ${porSemana?`<span style="font-size:13px;color:var(--cinza-600);">·</span>
      <select onchange="window._coletaSem=parseInt(this.value);FIN_renderColetas()">${semanas.map(s=>`<option value="${s}" ${s===sem?'selected':''}>${FIN_rotSemana(s)}</option>`).join('')}</select>`:''}
    </div>
    <div class="filtros" style="margin-bottom:10px;flex-wrap:wrap;">
      <input type="text" placeholder="Buscar cliente..." value="${(window._coletaBusca||'').replace(/"/g,'&quot;')}" oninput="window._coletaBusca=this.value;FIN_renderColetas()" style="padding:7px 10px;border:1.5px solid var(--cinza-300);border-radius:8px;font-size:13px;min-width:180px;">
      <span style="font-size:13px;color:var(--cinza-600);">Mostrar:</span>
      <select onchange="window._coletaFiltro=this.value;FIN_renderColetas()">
        <option value="movimento" ${filtroEx==='movimento'?'selected':''}>Com movimento nos 2 meses (${nMovimento})</option>
        <option value="caiu" ${filtroEx==='caiu'?'selected':''}>Só quem caiu</option>
        <option value="parou" ${filtroEx==='parou'?'selected':''}>Só quem parou de coletar (${nParou})</option>
        <option value="novos" ${filtroEx==='novos'?'selected':''}>Só clientes novos (${nNovos})</option>
        <option value="todos" ${filtroEx==='todos'?'selected':''}>Todos</option>
      </select>
      <span style="font-size:13px;color:var(--cinza-600);">Ordenar:</span>
      <select onchange="window._coletaOrdem=this.value;FIN_renderColetas()">
        <option value="var-menor" ${ordem==='var-menor'?'selected':''}>Variação: menor → maior (quem caiu)</option>
        <option value="var-maior" ${ordem==='var-maior'?'selected':''}>Variação: maior → menor</option>
        <option value="nome" ${ordem==='nome'?'selected':''}>Nome do cliente (A-Z)</option>
        <option value="volume" ${ordem==='volume'?'selected':''}>Maior volume</option>
      </select>
      <button class="btn sec" onclick="window.print()" style="margin-left:auto;"><i class="ti ti-printer"></i> Exportar</button>
    </div>
    ${painel}
    <div class="card">
      <h2>${titulo}${FIN_grupoSelecionadoNome()?` <span style="font-size:12px;font-weight:400;color:var(--cinza-500);">— detalhe por unidade e equipamento</span>`:''}</h2>
      <p style="font-size:12px;color:var(--cinza-500);margin-bottom:8px;">Verde = subiu, vermelho = caiu. Mostrando ${linhasEx.length} de ${linhas.length}.</p>
      <table><thead><tr>
        <th rowspan="2" style="vertical-align:bottom;">Cliente</th><th rowspan="2" style="vertical-align:bottom;">Equipamento / Resíduo</th>
        <th colspan="2" style="text-align:center;border-bottom:1px solid rgba(255,255,255,.25);">${rotYM(mesA)}</th>
        <th colspan="2" style="text-align:center;border-bottom:1px solid rgba(255,255,255,.25);">${rotYM(mesB)}</th>
        <th rowspan="2" style="vertical-align:bottom;">Variação<br><span style="font-weight:400;font-size:10px;">(coletado)</span></th></tr>
        <tr><th style="font-size:11px;">Coletado</th><th style="font-size:11px;">Faturado</th><th style="font-size:11px;">Coletado</th><th style="font-size:11px;">Faturado</th></tr></thead><tbody>
      ${linhasEx.map(l=>{
        const cor = l.varPct===null?'':(l.varPct>0.5?'pos':l.varPct<-0.5?'neg':'');
        const vtxt = l.varPct===null?'<span class="badge" style="background:var(--verde-claro-bg);color:var(--verde-escuro);">novo</span>':(l.qb===0?'<span class="neg">parou</span>':(l.varPct>0?'+':'')+l.varPct.toFixed(0)+'%');
        const pa = l.peso_a?` <span style="color:var(--cinza-400);font-size:11px;">(${l.peso_a.toFixed(1)}t)</span>`:'';
        const pb = l.peso_b?` <span style="color:var(--cinza-400);font-size:11px;">(${l.peso_b.toFixed(1)}t)</span>`:'';
        // faturado acima do coletado = a mínima entrou na conta (o cliente pagou mais do que gerou)
        const fmtF=(f,q)=>f>q+0.001?`<b style="color:var(--roxo);" title="A mínima do contrato entrou na conta">${Math.round(f)}</b> <span style="font-size:10px;color:var(--roxo);">mín.</span>`:`<span style="color:var(--cinza-500);">${Math.round(f)}</span>`;
        return `<tr><td><b>${l.cliente}</b></td><td style="font-size:12px;color:var(--cinza-600);">${l.equip}<br>${l.classe}</td><td>${l.qa}${pa}</td><td>${fmtF(l.fa,l.qa)}</td><td>${l.qb}${pb}</td><td>${fmtF(l.fb,l.qb)}</td><td class="${cor}">${vtxt}</td></tr>`;
      }).join('')||'<tr><td colspan=7 class="vazio">Nenhum cliente neste filtro.</td></tr>'}
      </tbody></table>
      <p style="font-size:11.5px;color:var(--cinza-500);margin-top:10px;line-height:1.6;">
        <b>Coletado</b> = o que a equipe realmente recolheu. <b>Faturado</b> = o que o cliente paga, já respeitando a mínima do contrato.<br>
        Quando o faturado aparece <b style="color:var(--roxo);">em roxo com "mín."</b>, o cliente gerou menos que a mínima e está pagando por ela — a coleta caiu, mas a receita não.
      </p>
    </div>`;
}

function FIN_renderColetaMes(meses, rotYM){
  const area=document.getElementById('coleta-area');
  const mes = window._coletaMesUnico || meses[meses.length-1];
  const mesAnt = meses[meses.indexOf(mes)-1];
  const fgM = FIN_filtroGrupo();
  const g=FIN_agrupaColetas(c=>c.ym===mes && fgM(c));
  const gAnt = mesAnt ? FIN_agrupaColetas(c=>c.ym===mesAnt && fgM(c)) : {};
  // agrupa por cliente/grupo (junta os equipamentos/resíduos dentro).
  // A chave é o RÓTULO já resolvido — assim funciona tanto por unidade quanto por grupo.
  const porCliente={};
  Object.keys(g).forEach(k=>{ const it=g[k];
    const kc=it.cliente;
    if(!porCliente[kc]) porCliente[kc]={cliente:it.cliente,itens:[],totalQ:0,totalF:0,totalP:0};
    const ant=gAnt[k];
    porCliente[kc].itens.push({equip:it.equip,classe:it.classe,coletado:it.coletado,faturado:it.faturado,peso:it.peso,qtdeAnt:ant?ant.coletado:null});
    porCliente[kc].totalQ+=it.coletado; porCliente[kc].totalF+=it.faturado; porCliente[kc].totalP+=it.peso;
  });

// ============ VARIAÇÃO DE FATURAMENTO (relatório geral de todos os clientes) ============
function FIN_processarFaturamentoVar(wb, st){
  // acha a aba com FINdados (SourceData ou a que tiver "Cliente")
  let ws=null;
  for(const nome of wb.SheetNames){
    const t=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:''});
    if(t.length && t.some(r=>r.some(v=>finLc(v).toLowerCase()==='cliente'))){ ws=wb.Sheets[nome]; break; }
  }
  if(!ws) ws=wb.Sheets[wb.SheetNames.find(n=>n.toLowerCase()==='sourcedata')||wb.SheetNames[0]];
  const grade=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  // acha o cabeçalho (linha com "Cliente")
  let hrow=grade.findIndex(r=>r.some(v=>finLc(v).toLowerCase()==='cliente'));
  if(hrow<0){ st.textContent='Não achei a coluna Cliente.'; st.style.color='var(--vermelho)'; return; }
  const cab=grade[hrow].map(v=>finLc(v));
  const iCli=cab.findIndex(c=>c.toLowerCase()==='cliente');
  // meses = colunas que são nome de mês
  const idxMeses=[]; const nomesMeses=[];
  cab.forEach((c,i)=>{ if(FIN_MESES[c.toLowerCase().trim()]){ idxMeses.push(i); nomesMeses.push(c.trim()); } });
  if(!idxMeses.length){ st.textContent='Não achei colunas de mês (Abril, Maio...).'; st.style.color='var(--vermelho)'; return; }
  // substitui tudo (é um retrato completo, não incremental como os títulos)
  FINdados.faturamento=[];
  let n=0;
  for(let i=hrow+1;i<grade.length;i++){
    const cli=finLc(grade[i][iCli]);
    if(!cli || /^\d+$/.test(cli) || cli.toLowerCase().startsWith('total')) continue;
    const valores={};
    idxMeses.forEach((idx,k)=>{ valores[nomesMeses[k]]=finParseValorBR(grade[i][idx]); });
    FINdados.faturamento.push({ cliente:cli, valores });
    n++;
  }
  window._fatVarMeses = nomesMeses;
  st.textContent=`${n} clientes carregados (meses: ${nomesMeses.join(', ')}).`; st.style.color='var(--verde-medio)';
}

// reescreve no Sheets todo o faturamento que está em memória (corrige quando só um mês foi salvo lá)
async function FIN_reenviarFaturamento(){
  if(!FINdados.faturamento || !FINdados.faturamento.length){ alert('Não há faturamento em memória. Suba o relatório primeiro.'); return; }
  const nMeses = Object.keys(FINdados.faturamento[0].valores||{}).length;
  if(!confirm(`Regravar no sistema o faturamento de ${FINdados.faturamento.length} clientes (${nMeses} meses)? Isso corrige a ficha do cliente pra todo mundo.`)) return;
  try {
    if (typeof finInvalidarCache==='function') finInvalidarCache();
    await finEnviarSheetsCompleto('faturamento', null);
    alert('Faturamento reenviado! Agora a ficha do cliente mostra todos os meses.');
  } catch(e) { alert('Erro ao reenviar: '+e.message); }
}

// ===== MOTIVO da variação de faturamento (estudo automático + aprovação da Joyce) =====
// feriados que reduzem dias de coleta: nacionais + estaduais SP + municipais da capital (nacionais + móveis por ano)
const FIN_FERIADOS = {
  '2025-01':['Confraternização','Aniversário de SP'], '2025-03':['Carnaval'], '2025-04':['Sexta-feira Santa','Tiradentes'],
  '2025-05':['Dia do Trabalho'], '2025-06':['Corpus Christi'], '2025-07':['Revolução Constitucionalista (SP)'],
  '2025-09':['Independência'], '2025-10':['N. Sra. Aparecida'], '2025-11':['Finados','Proclamação da República','Consciência Negra'], '2025-12':['Natal'],
  '2026-01':['Confraternização','Aniversário de SP'], '2026-02':['Carnaval'], '2026-04':['Sexta-feira Santa','Tiradentes'],
  '2026-05':['Dia do Trabalho'], '2026-06':['Corpus Christi'], '2026-07':['Revolução Constitucionalista (SP)'],
  '2026-09':['Independência'], '2026-10':['N. Sra. Aparecida'], '2026-11':['Finados','Proclamação da República','Consciência Negra'], '2026-12':['Natal'],
};
const FIN_MES_IDX = {'janeiro':1,'fevereiro':2,'março':3,'marco':3,'abril':4,'maio':5,'junho':6,'julho':7,'agosto':8,'setembro':9,'outubro':10,'novembro':11,'dezembro':12};
function FIN_feriadosDoMes(ym){ return FIN_FERIADOS[ym] || []; }
function FIN_anoRefFat(){ const anos=(FINdados.coletas||[]).map(c=>parseInt(String(c.ym||'').slice(0,4))).filter(a=>a>2000); return anos.length?Math.max.apply(null,anos):new Date().getFullYear(); }
// mês do SERVIÇO (yyyy-mm) a partir do nome do mês FATURADO — aplica a defasagem de 1 mês
function FIN_ymServicoDeNome(nomeFaturado, ano){ const idx=FIN_MES_IDX[String(nomeFaturado||'').trim().toLowerCase()]; if(!idx) return ''; let m=idx-1, a=ano; if(m<1){ m=12; a=ano-1; } return a+'-'+String(m).padStart(2,'0'); }
function FIN_normNomeMot(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function FIN_chaveMotivo(cliente,mes){ return FIN_normNomeMot(cliente)+'||'+String(mes||'').trim().toUpperCase(); }
// para explicar a variação do faturamento, o que interessa é o COLETADO de verdade
// (a linha de complemento de mínima não é coleta — incluí-la mascararia a queda)
function FIN_qtdeColetasClienteYM(cliente, ym){ const n=FIN_normNomeMot(cliente); return (FINdados.coletas||[]).filter(c=>c.ym===ym && !c.ehCompl && FIN_normNomeMot(c.cliente)===n).reduce((s,c)=>s+(parseFloat(c.qtdeServ)||0),0); }

let _motivosFat=null, _reajFat=null, _assessFat=null;
window._fatMotivoSugestoes = window._fatMotivoSugestoes || {};
async function FIN_carregarAuxMotivo(){
  if(_motivosFat && _reajFat && _assessFat) return;
  try{ const r=await buscarDados('Fin_Motivos'); _motivosFat={}; if(r.ok) r.linhas.forEach(l=>{ _motivosFat[FIN_chaveMotivo(l['CLIENTE'],l['MES'])]={motivo:l['MOTIVO']||'',status:l['STATUS']||''}; }); }catch(e){ _motivosFat=_motivosFat||{}; }
  try{ const r=await buscarDados('Reajustes'); _reajFat=(r.ok?r.linhas:[]); }catch(e){ _reajFat=[]; }
  try{ const r=await buscarDados('Historico_Renovacoes_SP'); _assessFat=(r.ok?r.linhas:[]); }catch(e){ _assessFat=[]; }
}

// estuda os possíveis motivos da variação de um cliente no mês faturado (retorna string, '' se nada)
// ym (yyyy-mm) a partir do NOME do mês (sem defasagem — quando o mês já é o do serviço)
function FIN_ymDeNomeMes(nome, ano){ const idx=FIN_MES_IDX[String(nome||'').trim().toLowerCase()]; return idx ? (ano+'-'+String(idx).padStart(2,'0')) : ''; }

// NÚCLEO do estudo de motivo: recebe o mês do SERVIÇO já em ym (yyyy-mm) e o anterior.
// REGRA: só estuda motivo pra quem CAIU mais de 5% no faturamento. Quem não caiu fica sem motivo automático.
// Ordem (prioridade) das justificativas: 1) variação de equipamentos coletados  2) reajuste  3) assessoria SP Regula  4) feriado (por último).
function FIN_motivoDeServico(cliente, ymServ, ymServAnt, varPct){
  if(varPct==null || varPct >= -5) return ''; // sem queda relevante (> -5%) => sem motivo automático
  const nomeN=FIN_normNomeMot(cliente);
  const rot = ymServ ? finRotMes(ymServ) : '';
  const motivos=[];
  // 1) MOTIVO PRINCIPAL: variação (queda) na quantidade de equipamentos coletados
  if(ymServ && ymServAnt){
    const qA=FIN_qtdeColetasClienteYM(cliente, ymServ), qP=FIN_qtdeColetasClienteYM(cliente, ymServAnt);
    if(qP>0 && qA<qP){ const q=((qA-qP)/qP*100); motivos.push('Menos equipamentos coletados em '+rot+' ('+q.toFixed(0)+'%: '+qP+'→'+qA+')'); }
  }
  // 2) reajuste no mês do serviço
  const teveReaj=(_reajFat||[]).some(r=>{ if(FIN_normNomeMot(r['CLIENTE'])!==nomeN) return false; const d=parseDataReaj(r['DATA ÚLTIMO REAJUSTE ']||r['DATA ÚLTIMO REAJUSTE']); return d && (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))===ymServ; });
  if(teveReaj) motivos.push('Reajuste aplicado em '+rot);
  // 3) assessoria SP Regula/MTR no mês do serviço
  const ass=(_assessFat||[]).find(a=>{ if(FIN_normNomeMot(a['CLIENTE'])!==nomeN) return false; if(String(a['ASSESSORIA']||'').trim().toLowerCase()!=='sim') return false; const d=parseDataReaj(a['DATA_RENOVACAO']); return d && (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))===ymServ; });
  if(ass) motivos.push('Assessoria SP Regula/MTR em '+rot+(ass['VALOR']?(' (R$ '+ass['VALOR']+')'):''));
  // 4) feriado no mês do serviço (menos dias de coleta) — POR ÚLTIMO
  const fer=FIN_feriadosDoMes(ymServ);
  if(fer.length) motivos.push('Feriado em '+rot+' — menos dias de coleta ('+fer.join(', ')+')');
  return motivos.join(' · ');
}

// recebe o NOME do mês FATURADO (aplica a defasagem de 1 mês) — usado na página "Variação de Faturamento"
function FIN_estudarMotivoFat(cliente, mesAtualNome, mesAntNome, varPct){
  const ano=FIN_anoRefFat();
  return FIN_motivoDeServico(cliente, FIN_ymServicoDeNome(mesAtualNome, ano), mesAntNome?FIN_ymServicoDeNome(mesAntNome, ano):'', varPct);
}

async function salvarMotivoFatFront(cliente, mes, motivo, status){
  const msg=document.getElementById('motfat-msg'); if(msg) msg.innerHTML='<div style="text-align:center;padding:10px;color:var(--cinza-500);">Salvando...</div>';

    const resp=await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'salvarMotivoFat',token:sessaoToken,dados:{cliente,mes,motivo,status}})});

    if(!_motivosFat)_motivosFat={};
    _motivosFat[FIN_chaveMotivo(cliente,mes)]={motivo,status};
    fecharFicha();

      <select onchange="window._fatVarOrdem=this.value;FIN_renderFaturamentoVar()" style="margin-left:auto;">

      ${linhas.slice(0,300).map(l=>{
        let varCol='';
        if(mesAnt){ if(l.varPct===null) varCol='<td><span class="badge" style="background:var(--verde-claro-bg);color:var(--verde-escuro);">novo</span></td>';
          else { const cor=l.varPct>0.5?'pos':l.varPct<-0.5?'neg':''; varCol=`<td class="${cor}">${l.varPct>0?'+':''}${l.varPct.toFixed(1)}%</td>`; } }
        // MOTIVO: chave canônica pelo ym do mês de SERVIÇO (defasagem de 1 mês)
        const _ymServ=FIN_ymServicoDeNome(mesAtual, FIN_anoRefFat());
        const chave=FIN_chaveMotivo(l.cliente, _ymServ);
        const sug=FIN_estudarMotivoFat(l.cliente, mesAtual, mesAnt, l.varPct);
        window._fatMotivoSugestoes[chave]=sug;
        const salvo=(_motivosFat||{})[chave];
        let motCell;
        if(salvo && salvo.motivo && (salvo.status==='Aprovado'||salvo.status==='Manual')){
          const badge=salvo.status==='Aprovado'?'<i class="ti ti-circle-check" style="color:var(--verde-medio);"></i>':'<i class="ti ti-edit" style="color:var(--cinza-500);"></i>';
          motCell=`<span title="${(salvo.motivo||'').replace(/"/g,'&quot;')}">${badge} ${(salvo.motivo||'').slice(0,60)}${(salvo.motivo||'').length>60?'…':''}</span>`;
        } else if(salvo && salvo.status==='Recusado'){
          motCell=`<span style="color:var(--cinza-400);">recusado</span>`;
        } else if(sug){
          motCell=`<span style="color:var(--cinza-500);font-style:italic;"><i class="ti ti-bulb"></i> ${sug.slice(0,60)}${sug.length>60?'…':''} <span style="color:#2c5282;">(revisar)</span></span>`;
        } else {
          motCell=`<span style="color:var(--cinza-400);">+ adicionar</span>`;
        }
        const cliJs=String(l.cliente).replace(/'/g,"\\'");
        return `<tr><td><b>${l.cliente}</b></td>${mesAnt?`<td style="color:var(--cinza-600);">${finFmtM(l.ant)}</td>`:''}<td><b>${finFmtM(l.atual)}</b></td>${varCol}<td class="clicavel" style="max-width:280px;font-size:12px;" onclick="abrirMotivoFat('${cliJs}','${_ymServ}','${finRotMes(_ymServ)}')">${motCell}</td></tr>`;
      }).join('')}
      </tbody></table>
      <p style="font-size:11px;color:var(--cinza-500);margin-top:8px;"><i class="ti ti-info-circle"></i> A coluna <b>Motivo</b> sugere automaticamente (feriado, reajuste, queda de coletas, assessoria). Clique pra aprovar, recusar ou editar. O motivo fica salvo no card do cliente.</p>
    </div>`;
}



// ===================== MÓDULO FINANCEIRO (integrado do dashboard de testes) =====================
// Alimentado por upload manual (localStorage deste navegador). Acesso: admin/diretor + financeiro.
// Carrega o SheetJS sob demanda (só quando o módulo é aberto).
let _finSheetJSCarregado = false;
function FIN_garantirSheetJS(cb){
  if (_finSheetJSCarregado || window.XLSX) { _finSheetJSCarregado = true; return cb(); }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = () => { _finSheetJSCarregado = true; cb(); };
  s.onerror = () => { cb(); }; // se falhar, o parser nativo ainda tenta
  document.head.appendChild(s);
}
const FIN_HTML_RELATORIOS = '\n    <div class="card" style="background:#fff;border:1px solid var(--cinza-200);border-radius:14px;padding:20px;margin-bottom:16px;">\n      <h2 style="color:var(--verde-escuro);font-size:16px;margin:0 0 10px;">Suba os relatórios</h2>\n      <div style="background:#eef4fb;color:#2c5282;border-radius:8px;padding:10px;font-size:12.5px;margin-bottom:14px;"><i class="ti ti-info-circle"></i> Os dados ficam só neste navegador. O sistema soma só o que veio a mais (não conta título repetido).</div>\n      <div class="upload-box" id="ub-pagar"><label for="f-pagar"><i class="ti ti-file-spreadsheet" style="font-size:22px;display:block;margin-bottom:6px;"></i> Contas a Pagar (.xlsx)</label><input type="file" id="f-pagar" accept=".xlsx" onchange="FIN_lerArquivo(this,\'pagar\')"><div id="st-pagar" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'pagar\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div class="upload-box" id="ub-receber"><label for="f-receber"><i class="ti ti-file-spreadsheet" style="font-size:22px;display:block;margin-bottom:6px;"></i> Contas a Receber — <b>EMITIDOS no mês</b> (filtro Emissão)</label><input type="file" id="f-receber" accept=".xlsx" onchange="FIN_lerArquivo(this,\'receber\')"><div id="st-receber" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'receber\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div class="upload-box" id="ub-recebeReceb"><label for="f-recebeReceb"><i class="ti ti-cash" style="font-size:22px;display:block;margin-bottom:6px;"></i> Contas a Receber — <b>RECEBIDOS no mês</b> (filtro Recebimento)</label><input type="file" id="f-recebeReceb" accept=".xlsx" onchange="FIN_lerArquivo(this,\'recebeReceb\')"><div id="st-recebeReceb" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'recebeReceb\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div class="upload-box" id="ub-comissao"><label for="f-comissao"><i class="ti ti-file-spreadsheet" style="font-size:22px;display:block;margin-bottom:6px;"></i> Planilha de Comissões (uma aba por consultor)</label><input type="file" id="f-comissao" accept=".xlsx" onchange="FIN_lerArquivo(this,\'comissao\')"><div id="st-comissao" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'fechamentos\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div class="upload-box" id="ub-servicos"><label for="f-servicos"><i class="ti ti-recycle" style="font-size:22px;display:block;margin-bottom:6px;"></i> Relatório de Serviços (coletas — .csv)</label><input type="file" id="f-servicos" accept=".csv" onchange="FIN_lerArquivo(this,\'servicos\')"><div id="st-servicos" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'coletas\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div class="upload-box" id="ub-faturamento"><label for="f-faturamento"><i class="ti ti-chart-line" style="font-size:22px;display:block;margin-bottom:6px;"></i> Variação de Faturamento (todos os clientes — .xlsx)</label><input type="file" id="f-faturamento" accept=".xlsx" onchange="FIN_lerArquivo(this,\'faturamento\')"><div id="st-faturamento" style="font-size:12px;color:var(--cinza-500);margin-top:6px;"></div><div style="margin-top:8px;"><span onclick="FIN_limparTipo(\'faturamento\')" style="font-size:11px;color:var(--vermelho);cursor:pointer;"><i class="ti ti-trash"></i> Limpar só este</span></div></div>\n      <div style="margin-top:12px;"><button class="ficha-btn-secundario" onclick="FIN_limparTudo()"><i class="ti ti-trash"></i> Limpar tudo</button></div>\n    </div>\n    <div class="card" style="background:#fff;border:1px solid var(--cinza-200);border-radius:14px;padding:20px;"><h2 style="color:var(--verde-escuro);font-size:16px;margin:0 0 10px;">O que já está acumulado</h2><div id="resumo-acumulado">Nenhum relatório carregado ainda.</div></div>\n';
function renderFinanceiro(area, subId){
  area.innerHTML = '<div class="placeholder"><i class="ti ti-loader"></i><h2>Carregando...</h2></div>';
  FIN_garantirSheetJS(async function(){
    finCarregar(); // cache local (instantâneo)

    // A tela de RELATÓRIOS é só upload — abre na hora, sem esperar o Sheets.
    // O resumo "o que já está acumulado" é preenchido em segundo plano.
    if (subId === 'fin-relatorios'){
      area.innerHTML = '<div id="fin-wrap">' + FIN_HTML_RELATORIOS + '</div>';
      finAtualizarTudo(); // mostra o que já tem no cache local, na hora
      // atualiza o resumo com os dados do Sheets quando chegarem (não trava a tela)
      // 'coletas' fica fora de propósito: são milhares de linhas e aqui serve só pra um contador
      finCarregarDoSheets(['pagar','receber','recebeReceb','fechamentos','faturamento'])
        .then(()=>{ if (document.getElementById('resumo-acumulado')) finAtualizarTudo(); })
        .catch(()=>{});
      return;
    }

    // demais telas: carrega só os tipos que precisa (em paralelo, com cache)
    const TIPOS_POR_TELA = {
      'fin-saude':       ['pagar','receber'],
      'fin-pagar':       ['pagar'],
      'fin-receber':     ['receber','recebeReceb'],
      'fin-coletas':     ['coletas'],
      'fin-fislurb':     [],
    };
    try { await finCarregarDoSheets(TIPOS_POR_TELA[subId] || []); } catch(e){ /* segue com o cache local */ }
    const mapa = {
      'fin-saude':      { id:'p-saude',      fn: FIN_renderSaude },
      'fin-pagar':      { id:'p-pagar',      fn: FIN_renderPagar },
      'fin-receber':    { id:'p-receber',    fn: FIN_renderReceber },
      'fin-coletas':    { id:'p-coletas',    fn: FIN_renderColetas },
      'fin-fislurb':    { id:'p-fislurb',    fn: FIN_renderFislurb },
    };
    const alvo = mapa[subId];
    if (!alvo){ area.innerHTML = '<div class="sem-acesso">Tela não encontrada.</div>'; return; }
    area.innerHTML = '<div id="fin-wrap"><div id="'+alvo.id+'"></div></div>';
    try { alvo.fn(); } catch(e){ area.innerHTML = '<div class="sem-acesso">Erro ao renderizar: '+e.message+'</div>'; }
  });
}
